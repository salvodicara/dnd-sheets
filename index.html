function renderSkills(){
  const C=CHAR; const skillsMap=C.skills||{};
  const pb=C.proficiencyBonusOverride??(C.proficiencyBonus||computedPB(C.level||1));
  const scores=C.abilityScores||{};
  function skillBonus(ability, type){
    const base=abilityMod(scores[ability]||10);
    if(type==='expertise')       return base+pb*2;
    if(type==='proficient')      return base+pb;
    if(type==='halfProficiency') return base+Math.floor(pb/2);
    return base;
  }
  // v3: skills is a map {skillId: proficiencyLevel}. Show all standard skills.
  const entries=DND.standardSkills
    .map(sk=>({id:sk.id, name:skillName(sk), ability:sk.ability, type:skillsMap[sk.id]||'none'}));
  const rows=entries.map(sk=>{
    const isProficient=sk.type!=='none';
    const bonusVal=skillBonus(sk.ability, sk.type);
    const profLabel=sk.type==='expertise'?T('expertise'):sk.type==='proficient'?T('proficient'):sk.type==='halfProficiency'?T('halfProf'):'';
    return `<tr class="${isProficient?'':'skill-none'}">
    <td>${sk.name} <span style="font-size:.75em;color:var(--text-muted);">(${abilityShortName(sk.ability)})</span></td>
    <td><strong>${modStr(bonusVal)}</strong></td>
    <td style="font-size:.8em;">${profLabel}</td></tr>`;
  }).join('');
  const body=`<table><tr><th>${T('skills')}</th><th>${T('lbl_bonus')}</th><th></th></tr>${rows}</table>`;
  const passivePerc=10+skillBonus('WIS', skillsMap['perception']||'none');
  const passiveInv=10+skillBonus('INT', skillsMap['investigation']||'none');
  const passiveIns=10+skillBonus('WIS', skillsMap['insight']||'none');
  const passiveBox=`<div class="passive-scores-row">
    <div class="passive-score-box"><div class="passive-score-val">${passivePerc}</div><div class="passive-score-lbl">${T('passivePerception')}</div></div>
    <div class="passive-score-box"><div class="passive-score-val">${passiveInv}</div><div class="passive-score-lbl">${T('passiveInvestigation')}</div></div>
    <div class="passive-score-box"><div class="passive-score-val">${passiveIns}</div><div class="passive-score-lbl">${T('passiveInsight')}</div></div>
  </div>`;
  return `${sectionHeader('skills',EDIT_MODE?`<button class="btn-edit-sm edit-only" style="margin-left:auto" onclick="editSkills()">✏️</button>`:'')}
    <div class="section-header-line"></div>${body}${passiveBox}
    <hr>`;
}

function renderFeature(f,i){
  // support both canonical (title/contentBlocks) and legacy (name/content)

    <div class="section-header-line"></div>${subLine}${blocks}<hr>`;

function renderContentBlock(b){
  if(!b) return '';
  switch(b.type){
    case 'paragraph': return `<p>${md(b.text||'')}</p>`;
    case 'bullets': return `<ul>${(b.bullets||b.items||[]).map(it=>`<li>${md(it)}</li>`).join('')}</ul>`;
    case 'note': return `<p class="note">${md(b.text||'')}</p>`;
    case 'header': return `<h3>${md(b.text||b.title||'')}</h3>`;
    case 'table': return `<table>${b.headers?.length?`<tr>${b.headers.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}
      ${(b.rows||[]).map(r=>`<tr>${r.map(c=>`<td>${md(String(c))}</td>`).join('')}</tr>`).join('')}</table>`;
    case 'subfeature': {
      const stitle=b.title||b.name||'';
      const sblocks=(b.contentBlocks||b.content||[]).map(renderContentBlock).join('');
      return `<div class="subfeature-block">
         <div class="subfeature-header"><span>${b.emoji||''}</span>
           <span class="subfeature-title">${stitle}</span>
           ${renderTags(b.tags)}
         </div>${sblocks}</div>`;
    }
    default: return '';
  }
}

    ${EDIT_MODE?`<div class="edit-only" style="display:flex!important;gap:6px;margin-top:8px;flex-wrap:wrap;">
      <button class="btn-edit-sm" onclick="editSpellcasting()">✏️ ${T('editMagic')}</button>

  // Spell filter bar
  const SF=SPELL_FILTER;

  const filterBar=`<div class="spell-filter-bar">

    ${SF.text||SF.school||SF.action||SF.prepared?`<button class="spell-filter-btn" onclick="clearSpellFilter()">✕</button>`:''}

  let spellSections='';
  levels.forEach(lv=>{
    let lvSpells=spells.filter(s=>s.level===lv);
    // Apply filters
    if(SF.text) lvSpells=lvSpells.filter(s=>(s.name||'').toLowerCase().includes(SF.text.toLowerCase())||(s.originalName||'').toLowerCase().includes(SF.text.toLowerCase()));
    if(SF.school) lvSpells=lvSpells.filter(s=>s.school===SF.school);

    }).join('');
    spellSections+=`<div class="spell-level-section">

        ${EDIT_MODE?`<button class="btn-edit-sm edit-only" onclick="addSpell(${lv})" style="margin-left:auto;">＋</button>`:''}
      </div>${cards}</div>`;
  });
  return `${sectionHeader('spells',EDIT_MODE?`<button class="btn-edit-sm edit-only" style="margin-left:auto" onclick="addSpell(0)">＋</button>`:'')}

    ${EDIT_MODE?`<button class="add-btn edit-only" onclick="addSpell(null)">${T('addSpell')}</button>`:''}
    <hr>`;
}
function renderWeapons(){

  function weaponAtk(w){

function addLog(msg,type=''){
  const w=document.getElementById('log-wrap'); if(!w) return;
  const empty=w.querySelector('p[style*="font-style:italic"]');if(empty)w.innerHTML='';
  const p=document.createElement('p'); p.className=type; p.innerHTML=msg;
  w.prepend(p); while(w.children.length>40) w.removeChild(w.lastChild);
  SESSION.logEntries=SESSION.logEntries||[];
  SESSION.logEntries.unshift({msg,type,t:Date.now()});
  if(SESSION.logEntries.length>40) SESSION.logEntries.pop();
}
function updateHPDisplay(){
  const S=SESSION, C=CHAR;
  const effMax=(C.hp?.max||0)+(S.hp?.aidBonus||0);
  const curr=S.hp?.current??0;
  const pct=effMax>0?Math.max(0,Math.min(100,(curr/effMax)*100)):0;
  const color=pct>50?'var(--hp-green)':pct>25?'var(--hp-yellow)':'var(--hp-red)';
  const hc=document.getElementById('hp-curr'); if(hc) hc.textContent=curr;
  const hm=document.getElementById('hp-max-disp'); if(hm) hm.textContent=effMax;
  const bar=document.getElementById('hp-bar'); if(bar){bar.style.width=pct+'%';bar.style.background=color;}
  const th=document.getElementById('temp-hp-disp'); if(th) th.textContent=S.hp?.temp||0;
  const ad=document.getElementById('aid-disp'); if(ad) ad.textContent=modStr(S.hp?.aidBonus||0);
  const sm=document.getElementById('stat-hp-max'); if(sm) sm.textContent=effMax;
}
function getHPAmount(){const v=parseInt(document.getElementById('hp-amount')?.value)||0; return v;}
function applyDamage(){
  let amt=getHPAmount(); if(!amt){showToast(T('errNoAmt'),'error');return;}
  const S=SESSION.hp;
  if(S.temp>0){const abs=Math.min(S.temp,amt);S.temp-=abs;amt-=abs;if(abs>0)addLog(`🛡️ ${T('logAbsorb')} ${abs}.`,'log-heal');}
  S.current=Math.max(0,S.current-amt);
  if(amt>0) addLog(`${T('logDmg')} ${amt} → ${T('hpAbbr')}: ${S.current}`,'log-damage');
  document.getElementById('hp-amount').value='';
  updateHPDisplay(); saveAll();
}
function applyHeal(){
  const amt=getHPAmount(); if(!amt){showToast(T('errNoAmt'),'error');return;}
  const S=SESSION.hp, effMax=(CHAR.hp?.max||0)+(S.aidBonus||0);
  S.current=Math.min(effMax,S.current+amt);

}

function findTrackerById(id){
  // Check equipment trackers
  const eq=(CHAR.equipment||[]).find(e=>e.tracked && 'eq-'+slugify(e.name)===id);
  if(eq) return {label:eq.name, emoji:eq.emoji||'📦', total:eq.quantity||1, potionFormula:eq.potionFormula, isPotion:eq.isPotion};
  // Check feature-embedded trackers (plural array)
  for(const f of (CHAR.features||[])){
    for(const t of (f.trackers||[])){
      if(slugify(t.label||f.title)===id) return {label:t.label||f.title, emoji:t.emoji||f.emoji, total:t.total, die:t.die};
    }
  }
  return null;
}

function setAidBonus(){
  const el=document.getElementById('aid-disp'); if(!el) return;
  if(el.querySelector('input')) return;
  const cur=SESSION.hp?.aidBonus||0;
  el.innerHTML=`<input type="number" id="aid-input" value="${cur}" style="width:50px;font-size:.9em;padding:1px 4px;border:1px solid var(--accent);border-radius:4px;background:var(--bg-input);color:var(--text);text-align:center;">`;
  const inp=document.getElementById('aid-input'); inp.focus(); inp.select();
  let saved=false;
  const save=()=>{
    if(saved) return; saved=true;
    const oldBonus=SESSION.hp.aidBonus||0;
    const newBonus=parseInt(inp.value)||0;
    const delta=newBonus-oldBonus;
    SESSION.hp.aidBonus=newBonus;
    const newEffMax=(CHAR.hp?.max||0)+newBonus;
    if(delta>0){
      // Aid granted / boosted: current HP rises by delta, capped at new effMax
      SESSION.hp.current=Math.min(newEffMax,(SESSION.hp.current||0)+delta);
    } else if(delta<0){
      // Aid expired / reduced: clamp current HP down to new effMax
      SESSION.hp.current=Math.min(SESSION.hp.current||0,newEffMax);
    }
    updateHPDisplay(); saveAll();
    if(delta>0) addLog(`${T('logAidUp')}${newBonus} HP. ${T('hpAbbr')}: ${SESSION.hp.current}/${newEffMax}`,'log-heal');
    else if(delta<0) addLog(`${T('logAidDown')} ${SESSION.hp.current}/${newEffMax}`,'log-damage');
  };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape'){el.textContent=modStr(cur);}});
}

function applyHDResult(){
  const S=SESSION, C=CHAR;
  const qtyEl=document.getElementById('hd-qty');
  const resultEl=document.getElementById('hd-result');
  const qty=qtyEl?+qtyEl.textContent:1;
  const healed=resultEl?+resultEl.value:0;
  if(!resultEl?.value.trim()){showToast(T('hdEnterResult'),'error');return;}
  const available=(C.level||1)-(S.hitDice?.used||0);
  const n=Math.min(qty,available);
  if(n<=0){closeHDDialog();return;}
  const effMax=(C.hp?.max||0)+(S.hp?.aidBonus||0);
  const before=S.hp.current||0;
  S.hp.current=Math.min(effMax,before+Math.max(0,healed));
  S.hitDice.used=(S.hitDice.used||0)+n;
  const actualHealed=S.hp.current-before;
  addLog(`${T('logHD')} ${n}d${C.hitDieType||8} → +${actualHealed} ${T('hpAbbr')}`,'log-heal');
  showToast(T('toastShortRest').replace('{N}',actualHealed),'success');
  closeHDDialog();
}

function exportCharacter(){
  if(!CHAR){showToast(T('errNoChar'),'error');return;}
  const data=buildExportData();
  const json=JSON.stringify(data,null,2);
  const name=(CHAR.name||'personaggio').replace(/[^a-z0-9]/gi,'_').toLowerCase();
  const date=new Date().toISOString().slice(0,10);
  const filename=`${name}_${date}.json`;
  try{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    addLog(T('logExport'),'log-heal');showToast(T('toastExported'),'success');return;
  }catch(e){}
  try{
    const uri='data:application/json;charset=utf-8,'+encodeURIComponent(json);
    const w=window.open(uri,'_blank');
    if(w){showToast(T('toastExportFallback'),'info');return;}
  }catch(e){}
  copyToClipboard(json);
}
function copyToClipboard(text){
  const json=text||JSON.stringify(buildExportData(),null,2);
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(json).then(()=>showToast(T('toastCopied'),'success'));
  }else{
    const ta=document.createElement('textarea');
    ta.value=json;ta.style.cssText='position:fixed;top:-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);showToast(T('toastCopied'),'success');
  }
}
function validateAndMigrateChar(c){
  if(!c||typeof c!=='object') throw new Error('Not a valid character object');
  if(!c.name||typeof c.name!=='string'||!c.name.trim()) throw new Error('Missing character name');
  // Safe defaults for arrays
  if(!Array.isArray(c.features))       c.features=[];
  if(!Array.isArray(c.spells))         c.spells=[];
  if(!Array.isArray(c.weapons))        c.weapons=[];
  if(!Array.isArray(c.equipment))      c.equipment=[];
  if(!Array.isArray(c.spellSlots))     c.spellSlots=[];
  if(!Array.isArray(c.sidebar))        c.sidebar=[...DEFAULT_SIDEBAR];
  if(!Array.isArray(c.combatAlgorithm))c.combatAlgorithm=[];
  if(!Array.isArray(c.customConditions))c.customConditions=[];
  if(!Array.isArray(c.savingThrows))   c.savingThrows=[];
  // Level
  c.level=Math.max(1,Math.min(20,Math.floor(+c.level||1)));
  // HP
  if(!c.hp||typeof c.hp!=='object') c.hp={max:10};
  if(!(c.hp.max>0)) c.hp.max=10;
  // Ability scores
  if(!c.abilityScores||typeof c.abilityScores!=='object'||Array.isArray(c.abilityScores)) c.abilityScores={};
  DND.abilities.forEach(a=>{ if(typeof c.abilityScores[a]!=='number'||c.abilityScores[a]<1) c.abilityScores[a]=10; });
  // Skills: must be a plain map, not an array (legacy migration)
  if(Array.isArray(c.skills)||typeof c.skills!=='object') c.skills={};
  return c;
}
function importCharacter(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.character)throw new Error('No character field');
      CHAR=validateAndMigrateChar(data.character);
      SESSION=data.session||createDefaultSession(CHAR);
      closeWizard();
      syncSession();saveAll();renderAll();
      showToast(T('toastImported'),'success');
    }catch(err){showToast(T('errInvalidJSON')+': '+err.message,'error');}
    event.target.value='';
  };
  reader.readAsText(file);
}
function importSession(event){importCharacter(event);}

function wizBack(){

  if(CB_EDIT_IDX>=0){cancelBlockEdit();return;}
  if(ALGO_EDIT_IDX>=0){cancelAlgoStep();return;}
  if(WIZ_TRK_EDIT>=0){cancelWizTrkEdit();return;}

function wizNext(){

function renderWizardStep(){
  const step=WIZ_CONFIG.steps[WIZ_STEP];
  const total=WIZ_CONFIG.steps.length;
  document.getElementById('wiz-title').textContent=T(WIZ_CONFIG.title)+(WIZ_EDIT_IDX!==null?' ('+T('wizEdit')+')':'');
  document.getElementById('wiz-step-label').textContent=`${T('step')} ${WIZ_STEP+1} / ${total}: ${T(step.label)}`;
  document.getElementById('wiz-progress').style.width=`${((WIZ_STEP+1)/total)*100}%`;
  const backBtn=document.getElementById('wiz-back');
  backBtn.disabled=(WIZ_STEP===0);
  backBtn.style.display=(WIZ_STEP===0)?'none':'';
  document.getElementById('wiz-next').textContent=(WIZ_STEP===total-1)?T('wizSave'):T('wizNext');
  let html='';
  // Custom step renderer overrides default field-based rendering
  if(step._renderStep){
    html=step._renderStep(WIZ_DATA);
    document.getElementById('wiz-body').innerHTML=html;
    if(step._afterRender) step._afterRender(WIZ_DATA);
    return;
  }
  // support _buildFields() for lazy field generation (e.g. language-dependent)
  const fields=step._buildFields?step._buildFields():(step.fields||[]);
  fields.forEach(f=>{html+=renderField(f);});
  if(step.hasContentBlocks) html+=renderContentBlockEditor();
  if(step.hasAlgoSteps) html+=renderAlgoStepEditor();
  document.getElementById('wiz-body').innerHTML=html;
  // Restore values from WIZ_DATA (use lazy fields if defined)
  const restoreFields=step._buildFields?step._buildFields():(step.fields||[]);
  restoreFields.forEach(f=>{
    const el=document.getElementById('wf-'+f.id);
    if(!el)return;
    const val=WIZ_DATA[f.id]??f.default??'';
    if(f.type==='checkbox') el.checked=!!val;
    else if(f.type==='select-or-custom'){
      const optArr=typeof f.options==='function'?f.options():(f.options||[]);
      const isCustom=val && val!=='_custom' && !optArr.some(o=>o.v===val && o.v!=='_custom');
      el.value=isCustom?'_custom':val;
      const ci=document.getElementById('wf-'+f.id+'-custom');
      if(ci){ci.value=isCustom?val:'';ci.style.display=isCustom?'block':'none';}
    }
    else el.value=val;
  });
  // Call _afterRender hook for field-based steps too (e.g. class→subclass dependency)
  if(step._afterRender) step._afterRender(WIZ_DATA);
  // Always sync the live preview after the step is fully rendered
  injectWizPreview();
}
function renderField(f){
  const hintAttr=f.hint?` title="${T(f.hint).replace(/"/g,'&quot;')}"`:''
  const lbl=f.label?`<label for="wf-${f.id}" class="wiz-label"${hintAttr}>${T(f.label)}${f.required?` <span style="color:var(--accent)">*</span>`:''}${f.hint?' <span style="cursor:help;opacity:.5;">ⓘ</span>':''}</label>`:'';
  let inp='';
  const val=WIZ_DATA[f.id]??f.default??'';
  if(f.type==='text'||f.type==='number'){
    inp=`<input id="wf-${f.id}" class="wiz-input" type="${f.type}" placeholder="${T(f.placeholder||'')}" value="${val}" ${f.min!==undefined?'min='+f.min:''} ${f.max!==undefined?'max='+f.max:''}>`;
  }else if(f.type==='textarea'){
    inp=`<textarea id="wf-${f.id}" class="wiz-input" rows="${f.rows||3}" placeholder="${T(f.placeholder||'')}">${val}</textarea>`;
  }else if(f.type==='select'){
    const optArr=typeof f.options==='function'?f.options():(f.options||[]);
    const opts=optArr.map(o=>`<option value="${o.v}" ${String(val)===String(o.v)?'selected':''}>${o.l}</option>`).join('');
    inp=`<select id="wf-${f.id}" class="wiz-input">${opts}</select>`;
  }else if(f.type==='checkbox'){
    inp=`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input id="wf-${f.id}" type="checkbox" ${val?'checked':''}> ${T(f.checkLabel||'')}</label>`;
  }else if(f.type==='emoji'){
    inp=`<input id="wf-${f.id}" class="wiz-input" type="text" maxlength="4" placeholder="🧙" value="${val}" style="font-size:1.6em;width:70px;">`;
  }else if(f.type==='select-or-custom'){
    const optArr=typeof f.options==='function'?f.options():(f.options||[]);
    const isCustom=val && val!=='_custom' && !optArr.some(o=>o.v===val && o.v!=='_custom');
    const selVal=isCustom?'_custom':val;
    const opts=optArr.map(o=>`<option value="${o.v}" ${String(selVal)===String(o.v)?'selected':''}>${o.l}</option>`).join('');
    inp=`<select id="wf-${f.id}" class="wiz-input" onchange="toggleCustomInput('${f.id}')">${opts}</select>

  }
  return `<div class="wiz-field">${lbl}${inp}</div>`;

function collectStepData(){
  const step=WIZ_CONFIG?.steps[WIZ_STEP];
  if(!step)return;
  if(step._collectData){ step._collectData(WIZ_DATA); return; }
  const fields=step._buildFields?step._buildFields():(step.fields||[]);
  fields.forEach(f=>{
    const el=document.getElementById('wf-'+f.id);
    if(!el)return;
    if(f.type==='checkbox') WIZ_DATA[f.id]=el.checked;
    else if(f.type==='number') WIZ_DATA[f.id]=el.value!==''?Number(el.value):null;
    else if(f.type==='select-or-custom'){
      const ci=document.getElementById('wf-'+f.id+'-custom');
      WIZ_DATA[f.id]=el.value==='_custom'?(ci?.value||''):el.value;
    }
    else WIZ_DATA[f.id]=el.value;
  });
}
function validateStep(){
  const step=WIZ_CONFIG?.steps[WIZ_STEP];
  if(!step)return null;
  if(step._validateStep) return step._validateStep(WIZ_DATA);
  const fields=step._buildFields?step._buildFields():(step.fields||[]);
  for(const f of fields){
    if(f.required){
      const el=document.getElementById('wf-'+f.id);
      if(!el)continue;
      if(f.type==='checkbox')continue;
      if(f.type==='select-or-custom'){
        if(el.value==='_custom'){
          const ci=document.getElementById('wf-'+f.id+'-custom');
          if(!ci||!ci.value.trim()) return `${T('wizRequired')}: ${T(f.label)}`;
        } else if(!el.value||el.value.trim()==='') return `${T('wizRequired')}: ${T(f.label)}`;
        continue;
      }
      if(!el.value||el.value.trim()==='') return `${T('wizRequired')}: ${T(f.label)}`;
    }
  }
  return null;
}
function wizFinish(){
  collectStepData();
  const err=validateStep();
  if(err){showToast(err,'error');return;}
  WIZ_CONFIG.onSave(WIZ_DATA, WIZ_EDIT_IDX, WIZ_BLOCKS, WIZ_ALGO_STEPS);
  closeWizard(); saveAll(); renderAll();
  showToast(T('wizSaved'),'success');
}

    <div style="display:flex;gap:4px;">
      <button class="btn-edit-sm" onclick="editBlock(${i})">✏️</button>

      ${i<WIZ_BLOCKS.length-1?`<button class="btn-edit-sm" onclick="moveBlock(${i},1)">▼</button>`:''}
    </div>
  </div>`).join('');
  const typeOpts=Object.entries(DND.blockTypes).map(([k,enV])=>`<option value="${k}">${dndTr('blockTypes',k)||enV}</option>`).join('');
  return `<div class="wiz-field"><label class="wiz-label">${T('contentBlocks')}</label>

      <button class="btn" onclick="addBlock()">${T('addBlock')}</button>

function addBlock(){
  const type=document.getElementById('cb-type-sel')?.value||'paragraph';
  WIZ_BLOCKS.push({type,text:'',title:'',emoji:'',rows:[],bullets:[],contentBlocks:[]});
  refreshCBEditor();
  editBlock(WIZ_BLOCKS.length-1);
}
let CB_EDIT_IDX=-1, CB_EDIT_DATA=null;
function editBlock(i){
  CB_EDIT_IDX=i;
  if(!CB_EDIT_DATA||CB_EDIT_DATA._srcIdx!==i) CB_EDIT_DATA={...JSON.parse(JSON.stringify(WIZ_BLOCKS[i])),_srcIdx:i};
  const row=document.getElementById('cb-row-'+i); if(!row) return;
  const b=CB_EDIT_DATA;
  let html='<div style="width:100%;padding:6px 0;">';
  if(b.type==='paragraph'||b.type==='note'){
    html+=`<textarea id="cbe-text" class="wiz-input" rows="3">${b.text||''}</textarea>`;
  } else if(b.type==='header'){
    html+=`<input id="cbe-text" class="wiz-input" type="text" value="${(b.text||b.title||'').replace(/"/g,'&quot;')}">`;
  } else if(b.type==='bullets'){
    html+=`<textarea id="cbe-text" class="wiz-input" rows="4" placeholder="${T('cbBulletsHint')}">${(b.bullets||b.items||[]).join('\n')}</textarea>`;
  } else if(b.type==='table'){
    html+=cbeRenderTable(b);
  } else if(b.type==='subfeature'){
    html+=cbeRenderSubfeature(b);
  }
  html+=`<div style="display:flex;gap:6px;margin-top:6px;">
    <button class="btn" onclick="saveBlockEdit()">✓ ${T('wizSave')}</button>
    <button class="btn" onclick="cancelBlockEdit()">✕</button></div></div>`;
  row.innerHTML=html;
  WIZ_BLOCKS.forEach((_,j)=>{if(j!==i){const r=document.getElementById('cb-row-'+j);if(r)r.classList.add('cb-dimmed');}});
  const addCtrl=document.getElementById('cb-add-controls');if(addCtrl)addCtrl.style.display='none';
}
function deleteBlock(i){WIZ_BLOCKS.splice(i,1);CB_EDIT_IDX=-1;CB_EDIT_DATA=null;refreshCBEditor();}
function saveBlockEdit(){
  if(CB_EDIT_IDX<0||!CB_EDIT_DATA)return;
  cbeCollectFromDOM();
  delete CB_EDIT_DATA._srcIdx;
  WIZ_BLOCKS[CB_EDIT_IDX]=CB_EDIT_DATA;
  CB_EDIT_IDX=-1;CB_EDIT_DATA=null;refreshCBEditor();
}
function cancelBlockEdit(){CB_EDIT_IDX=-1;CB_EDIT_DATA=null;refreshCBEditor();}
function cbeRenderTable(b){
  const rows=b.rows||[];
  let html='';
  rows.forEach((r,i)=>{
    html+=`<div class="cbe-tbl-row" style="display:flex;gap:4px;margin-bottom:4px;">
      <input class="wiz-input" style="flex:1" placeholder="${T('cbeKey')}" value="${(r[0]||'').replace(/"/g,'&quot;')}">
      <input class="wiz-input" style="flex:2" placeholder="${T('cbeValue')}" value="${(r[1]||'').replace(/"/g,'&quot;')}">
      <button class="btn-del-sm" onclick="cbeDeleteTableRow(${i})">🗑</button>
    </div>`;
  });
  html+=`<button class="btn" onclick="cbeAddTableRow()">${T('addRow')}</button>`;
  return html;
}
function cbeAddTableRow(){
  cbeCollectFromDOM();
  CB_EDIT_DATA.rows=CB_EDIT_DATA.rows||[];
  CB_EDIT_DATA.rows.push(['','']);
  editBlock(CB_EDIT_IDX);
}
function cbeDeleteTableRow(idx){
  cbeCollectFromDOM();
  CB_EDIT_DATA.rows.splice(idx,1);
  editBlock(CB_EDIT_IDX);
}
function cbeRenderSubfeature(b){
  let html=`<div style="display:flex;gap:6px;margin-bottom:6px;">
    <input id="cbe-title" class="wiz-input" style="flex:2" placeholder="${T('cbSubTitle')}" value="${(b.title||'').replace(/"/g,'&quot;')}">
    <input id="cbe-emoji" class="wiz-input" style="width:3em" placeholder="🔹" value="${b.emoji||''}">
  </div>`;
  const subs=b.contentBlocks||[];
  subs.forEach((sb,i)=>{
    const txt=sb.type==='bullets'?(sb.bullets||[]).join('\n'):(sb.text||'');
    html+=`<div class="cbe-sub-row" style="display:flex;gap:4px;margin-bottom:4px;align-items:flex-start;">
      <span style="min-width:55px;font-size:.78em;color:var(--text-muted);padding-top:6px;">${sb.type}</span>
      <textarea class="wiz-input cbe-sub-text" data-type="${sb.type}" rows="2" style="flex:1">${txt}</textarea>
      <button class="btn-del-sm" style="margin-top:4px;" onclick="cbeDeleteSubBlock(${i})">🗑</button>
    </div>`;
  });
  html+=`<div style="display:flex;gap:4px;margin-top:4px;">
    <select id="cbe-sub-type" class="wiz-input" style="flex:1;">
      <option value="paragraph">paragraph</option>
      <option value="bullets">bullets</option>
      <option value="note">note</option>
    </select>
    <button class="btn" onclick="cbeAddSubBlock()">${T('cbAddSubBlock')}</button>
  </div>`;
  html+=cbeRenderTagEditor();
  return html;
}
function cbeAddSubBlock(){
  cbeCollectFromDOM();
  const type=document.getElementById('cbe-sub-type')?.value||'paragraph';
  CB_EDIT_DATA.contentBlocks=CB_EDIT_DATA.contentBlocks||[];
  CB_EDIT_DATA.contentBlocks.push(type==='bullets'?{type,bullets:[]}:{type,text:''});
  editBlock(CB_EDIT_IDX);
}
function cbeDeleteSubBlock(idx){
  cbeCollectFromDOM();
  CB_EDIT_DATA.contentBlocks.splice(idx,1);
  editBlock(CB_EDIT_IDX);
}
function cbeCollectFromDOM(){
  if(!CB_EDIT_DATA)return; const b=CB_EDIT_DATA;
  if(b.type==='paragraph'||b.type==='note') b.text=document.getElementById('cbe-text')?.value||'';
  else if(b.type==='header'){b.text=document.getElementById('cbe-text')?.value||'';b.title=b.text;}
  else if(b.type==='bullets') b.bullets=(document.getElementById('cbe-text')?.value||'').split('\n').filter(Boolean);
  else if(b.type==='table'){
    const rows=[];document.querySelectorAll('.cbe-tbl-row').forEach(r=>{
      const inp=r.querySelectorAll('.wiz-input');if(inp.length>=2)rows.push([inp[0].value,inp[1].value]);
    });b.rows=rows;
  } else if(b.type==='subfeature'){
    b.title=document.getElementById('cbe-title')?.value||'';
    b.emoji=document.getElementById('cbe-emoji')?.value||'';
    const blocks=[];document.querySelectorAll('.cbe-sub-row').forEach(r=>{
      const ta=r.querySelector('.cbe-sub-text');const type=ta?.dataset.type||'paragraph';const txt=ta?.value||'';
      if(type==='bullets')blocks.push({type,bullets:txt.split('\n').filter(Boolean)});else blocks.push({type,text:txt});
    });b.contentBlocks=blocks;
    // Tags are managed live via cbeAddTag/cbeDeleteTag on CB_EDIT_DATA.tags
  }
}
function moveBlock(i,dir){
  const j=i+dir; if(j<0||j>=WIZ_BLOCKS.length)return;
  [WIZ_BLOCKS[i],WIZ_BLOCKS[j]]=[WIZ_BLOCKS[j],WIZ_BLOCKS[i]];
  refreshCBEditor();
}
function refreshCBEditor(){
  const wrap=document.getElementById('cb-list'); if(!wrap)return;
  wrap.innerHTML=WIZ_BLOCKS.map((b,i)=>`<div class="cb-row" id="cb-row-${i}">
    <span>${b.emoji||''} <strong>${b.type}</strong>: ${String(b.text||b.title||b.label||b.bullets?.join(', ')||(b.rows?b.rows.length+' rows':'')||'').slice(0,50)}</span>
    <div style="display:flex;gap:4px;">
      <button class="btn-edit-sm" onclick="editBlock(${i})">✏️</button>
      <button class="btn-del-sm" onclick="deleteBlock(${i})">🗑</button>
      ${i>0?`<button class="btn-edit-sm" onclick="moveBlock(${i},-1)">▲</button>`:''}
      ${i<WIZ_BLOCKS.length-1?`<button class="btn-edit-sm" onclick="moveBlock(${i},1)">▼</button>`:''}
    </div>
  </div>`).join('');
  const addCtrl=document.getElementById('cb-add-controls');if(addCtrl)addCtrl.style.display='';
  injectWizPreview();
}

function moveAlgoStep(i,dir){
  const j=i+dir; if(j<0||j>=WIZ_ALGO_STEPS.length)return;
  [WIZ_ALGO_STEPS[i],WIZ_ALGO_STEPS[j]]=[WIZ_ALGO_STEPS[j],WIZ_ALGO_STEPS[i]];

  wrap.innerHTML=WIZ_ALGO_STEPS.map((s,i)=>`<div class="cb-row" id="algo-row-${i}">
    <span>${s.question?'❓ '+s.question.slice(0,40):s.bullets?.join(', ').slice(0,40)||'(step)'}${s.indent?' ↳':''}</span>
    <div style="display:flex;gap:4px;">
      <button class="btn-edit-sm" onclick="editAlgoStep(${i})">✏️</button>
      <button class="btn-del-sm" onclick="deleteAlgoStep(${i})">🗑</button>
      ${i>0?`<button class="btn-edit-sm" onclick="moveAlgoStep(${i},-1)">▲</button>`:''}
      ${i<WIZ_ALGO_STEPS.length-1?`<button class="btn-edit-sm" onclick="moveAlgoStep(${i},1)">▼</button>`:''}
    </div>
  </div>`).join('');
  injectAlgoPreview();
}

// ── Point Buy System ──
const POINT_BUY_COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const PB_MIN=8, PB_MAX=15, PB_DEFAULT_BUDGET=27;
function pbCost(score){ return POINT_BUY_COST[Math.max(PB_MIN,Math.min(PB_MAX,score))]??0; }
function pbTotalCost(data){
  return DND.abilities.reduce((sum,a)=>sum+pbCost(+(data[a]||10)),0);
}
function renderAbilityBuyStep(data){
  const budget=+(data.abilityBudget||PB_DEFAULT_BUDGET);
  const isFree=!!data._abFreeMode;
  const spent=pbTotalCost(data);
  const left=budget-spent;
  const over=left<0;
  let rows='';
  DND.abilities.forEach(a=>{
    const v=+(data[a]||10);
    const m=Math.floor((v-10)/2);
    const ms=(m>=0?'+':'')+m;
    const c=pbCost(v);
    const canDec=isFree?v>1:v>PB_MIN;
    const canInc=isFree?v<30:(v<PB_MAX&&left>0);
    rows+=`<div class="ab-row">
      <span class="ab-name">${abilityShortName(a)}</span>
      <button class="ab-btn" onclick="abAdj('${a}',-1)" ${canDec?'':'disabled'}>−</button>
      <input type="number" id="wf-${a}" class="ab-val" value="${v}"
        min="${isFree?1:PB_MIN}" max="${isFree?30:PB_MAX}"
        onchange="abSet('${a}',this.value)">
      <button class="ab-btn" onclick="abAdj('${a}',1)" ${canInc?'':'disabled'}>+</button>
      <span class="ab-mod">${ms}</span>
      ${isFree?'':`<span class="ab-cost">${c} ${T('abPts')}</span>`}
    </div>`;
  });
  const pct=Math.min(100,Math.round((spent/Math.max(1,budget))*100));
  return `<div class="ab-widget">
    <div class="ab-header">
      ${isFree?'':`<label>${T('abBudget')}:</label>
      <input type="number" class="ab-budget-input" id="wf-abilityBudget" value="${budget}" min="1" max="999" onchange="abBudgetChange(this.value)">`}
      <button class="ab-mode" onclick="abToggleMode()">${isFree?T('abPointBuy'):T('abFreeMode')}</button>
      ${isFree?'':`<span class="ab-remaining${over?' over':''}" id="ab-remain">${T('abRemaining')}: <strong>${left}</strong> / ${budget}</span>`}
    </div>
    ${isFree?'':`<div class="ab-bar"><div class="ab-bar-fill${over?' over':''}" id="ab-bar" style="width:${pct}%"></div></div>`}
    <div class="ab-grid">${rows}</div>
    ${isFree?'':`<div class="ab-ref">${T('abCostRef')}</div>`}
  </div>`;
}
function abAdj(ability,dir){
  const el=document.getElementById('wf-'+ability);
  if(!el)return;
  const isFree=!!WIZ_DATA._abFreeMode;
  let v=+(el.value||10)+dir;
  if(!isFree){ v=Math.max(PB_MIN,Math.min(PB_MAX,v)); }
  else { v=Math.max(1,Math.min(30,v)); }
  WIZ_DATA[ability]=v;
  renderWizardStep();
}
function abSet(ability,val){
  WIZ_DATA[ability]=Math.max(1,Math.min(30,+(val||10)));
  renderWizardStep();
}
function abBudgetChange(val){
  WIZ_DATA.abilityBudget=Math.max(1,+(val||PB_DEFAULT_BUDGET));
  renderWizardStep();
}
function abToggleMode(){
  // Collect current values before re-render
  DND.abilities.forEach(a=>{
    const el=document.getElementById('wf-'+a);
    if(el) WIZ_DATA[a]=+(el.value||10);
  });
  WIZ_DATA._abFreeMode=!WIZ_DATA._abFreeMode;
  renderWizardStep();
}

function schoolOpts(){ return DND.schools.map(s=>({v:s,l:dndTr('schools',s)||s})); }
function diceOpts(){ return DND.dice.map(d=>({v:d,l:d})); }
function hitDiceOpts(){ return ['d6','d8','d10','d12'].map(d=>({v:d,l:d})); }
function damageOpts(){ return DND.damageTypes.map(d=>({v:d,l:dndTr('damageTypes',d)||d})); }
function actionTypeOpts(){ return Object.entries(DND.actionLabels).map(([v,enL])=>({v,l:dndTr('actionLabels',v)||enL})); }
function alignOpts(){ const lbls=DND.tr[currentLang]?.alignments||DND.alignments; return DND.alignments.map((v,i)=>({v,l:lbls[i]||v})); }

// D&D identity opts — select + "Custom…" option for homebrew
function raceOpts(){ return [{v:'',l:'— '+T('f_race')+' —'},...DND.races.map(r=>({v:r,l:dndTr('races',r)})),{v:'_custom',l:T('custom')}]; }
function classOpts(){ return [{v:'',l:'— '+T('f_class')+' —'},...DND.classes.map(c=>({v:c,l:dndTr('classes',c)})),{v:'_custom',l:T('custom')}]; }
function backgroundOpts(){ return [{v:'',l:'— '+T('f_background')+' —'},...DND.backgrounds.map(b=>({v:b,l:dndTr('backgrounds',b)})),{v:'_custom',l:T('custom')}]; }
function subclassOpts(cls){ const list=DND.subclasses[cls]||[]; return [{v:'',l:'—'},...list.map(s=>({v:s,l:dndTr('subclasses',s)})),{v:'_custom',l:T('custom')}]; }
function sourceOpts(){
  const opts=[{v:'',l:'—'}];
  const cls=CHAR.class,sub=CHAR.subclass,race=CHAR.race,bg=CHAR.background;
  if(cls) opts.push({v:cls,l:dndTr('classes',cls)||cls});
  if(sub) opts.push({v:sub,l:dndTr('subclasses',sub)||sub});
  if(race) opts.push({v:race,l:dndTr('races',race)||race});
  if(bg) opts.push({v:bg,l:dndTr('backgrounds',bg)||bg});
  opts.push({v:'Feat',l:T('sourceFeat')},{v:'Origin Feat',l:T('sourceOriginFeat')});
  opts.push({v:'Magic Item',l:T('sourceMagicItem')},{v:'Combat Rule',l:T('sourceCombatRule')});
  opts.push({v:'_custom',l:T('custom')});
  return opts;
}
function translateSource(src){
  if(!src) return '';
  const fixed={Feat:'sourceFeat','Origin Feat':'sourceOriginFeat','Magic Item':'sourceMagicItem','Combat Rule':'sourceCombatRule'};
  if(fixed[src]) return T(fixed[src]);
  // Try each D&D category; check if key exists in translation map before using dndTr
  const lang=currentLang;
  for(const cat of ['classes','subclasses','races','backgrounds']){
    if(DND.tr[lang]?.[cat]?.[src]) return DND.tr[lang][cat][src];
  }
  return src;
}

      if(d.emoji) e.emoji=d.emoji;
      e.recovery=d.recovery||'manual';
      if(d.isPotion){ e.isPotion=true; e.potionFormula=d.potionFormula||''; }

    // Migrate SESSION tracker ID on rename
    if(idx!==null&&idx!==undefined){
      const old=CHAR.equipment[idx];
      const oldId='eq-'+slugify(old?.name);
      const newId='eq-'+slugify(e.name);
      if(oldId!==newId && SESSION.trackers?.[oldId]){
        SESSION.trackers[newId]=SESSION.trackers[oldId];
        delete SESSION.trackers[oldId];
      }
      CHAR.equipment[idx]=e;
    } else CHAR.equipment.push(e);
    // Ensure session entry for tracked items
    if(e.tracked){
      const tid='eq-'+slugify(e.name);
      if(!SESSION.trackers) SESSION.trackers={};

'level-up':{
  title:'wiz_levelUp_title',
  steps:[
    {label:'wiz_levelUp_step1',fields:[
      {id:'hpGain',label:'wiz_levelUp_hpGain',type:'number',min:0,required:true,hint:'hint_levelUp_hpGain'},
      {id:'useAverage',label:'wiz_levelUp_step1',type:'checkbox',checkLabel:'wiz_levelUp_useAvgCheck'},
    ],
     _afterRender(){
       const C=CHAR||{}; const die=C.hitDieType||8;
       const conMod=abilityMod(C.abilityScores?.CON||10);
       const avg=Math.floor(die/2)+1+conMod;
       const hdModStr=conMod>=0?`+${conMod}`:String(conMod);
       const hintEl=document.querySelector('#wf-hpGain')?.closest('.wiz-field')?.querySelector('.field-hint');
       if(hintEl) hintEl.textContent=`1d${die}${hdModStr} | ${T('wiz_levelUp_avg')}: ${Math.max(1,avg)}`;
        const cb=document.getElementById('wf-useAverage');
        const inp=document.getElementById('wf-hpGain');
        if(cb&&inp){
          cb.checked=true; inp.value=Math.max(1,avg);
          cb.addEventListener('change',()=>{if(cb.checked) inp.value=Math.max(1,avg);});
        }
     }},
    {label:'wiz_levelUp_step2',fields:[],
     _renderStep(){
       const C=CHAR||{}; const newLv=(C.level||1)+1;
       const pbChanged=computedPB(newLv)!==computedPB(C.level||1);
       const isCaster=!!(C.spellcasting?.ability);
       const checks=buildLevelUpChecks(C,newLv,pbChanged,isCaster);
       return `<p style="color:var(--accent);font-weight:700;font-size:1.1em;margin:0 0 6px;">⬆️ Level ${C.level||1} → ${newLv}</p>`
         +`<p style="color:var(--text-muted);font-size:.88em;margin:0 0 14px;">${T('lu_remindersDesc')}</p>`
         +checks.map(c=>`<div style="padding:7px 0;border-bottom:1px solid var(--border-light);font-size:.92em;">→ ${c}</div>`).join('');
     }}
  ],
  onSave(d){
    const gain=Math.max(0,+d.hpGain||0);
    CHAR.level=(CHAR.level||1)+1;
    if(!CHAR.hp) CHAR.hp={max:10};
    CHAR.hp.max=(CHAR.hp.max||10)+gain;
    if(SESSION?.hp) SESSION.hp.current=Math.min(CHAR.hp.max+(SESSION.hp.aidBonus||0),(SESSION.hp.current||0)+gain);
    addLog(T('logLevelUp').replace('{N}',CHAR.level)+(gain?` +${gain} ${T('hpAbbr')}`:''),'log-heal');
    const pbChanged=computedPB(CHAR.level)!==computedPB(CHAR.level-1);
    const isCaster=!!(CHAR.spellcasting?.ability);
    CHAR.levelUpChecklist=buildLevelUpChecks(CHAR,CHAR.level,pbChanged,isCaster)
      .map(text=>({text,done:false}));
  }
},

// Character
function editCharacter(){ openWizard('char-create',null,flattenChar()); }
function editLore(){ openWizard('lore',null,{...(CHAR.lore||{})}); }
function openCharInfoWizard(){ openWizard('char-create',null,flattenChar()); }
function openCharCreationWizard(){ openWizard('char-create'); }
function flattenChar(){
  const C=CHAR||{}; const sc=C.abilityScores||{};
  const saves=C.savingThrows||[];
  return {
    name:C.name,race:C.race,class:C.class,subclass:C.subclass,level:C.level,
    alignment:C.alignment,background:C.background,playerName:C.playerName,
     quote:C.quote,languages:C.languages,
    STR:sc.STR,DEX:sc.DEX,CON:sc.CON,INT:sc.INT,WIS:sc.WIS,CHA:sc.CHA,
    abilityBudget:C.abilityBudget||PB_DEFAULT_BUDGET,
    hpMax:C.hp?.max,hitDieType:C.hitDieType?'d'+C.hitDieType:'d8',ac:C.ac,armorNote:C.armorNote,speed:C.speed,
    weaponProficiencies:C.weaponProficiencies,armorProficiencies:C.armorProficiencies,
    toolProficiencies:C.toolProficiencies,initiativeBonus:C.initiativeBonus??null,
    proficiencyBonusOverride:C.proficiencyBonusOverride??null,
    savesSTR:saves.includes('STR'),savesDEX:saves.includes('DEX'),
    savesCON:saves.includes('CON'),savesINT:saves.includes('INT'),
    savesWIS:saves.includes('WIS'),savesCHA:saves.includes('CHA'),
    // Skills — flatten map {id:'proficiency'} -> {'sk_id':'proficiency'}
    ...Object.fromEntries(DND.standardSkills.map(sk=>[
      'sk_'+sk.id, (C.skills||{})[sk.id]||'none'
    ])),
    // Spellcasting step prefill (prefixed with sc_ to avoid collision)
    sc_ability:(C.spellcasting?.ability||''),
    sc_focus:(C.spellcasting?.focus||''),
    sc_preparedCaster:!!(C.spellcasting?.preparedCaster),
  };
}

// Sidebar item helpers (generic — covers links, separators, and mobile close)
function closeSidebarMobile(){ onOverlayClick(); }
function addSidebarSep(){
  if(!CHAR.sidebar) CHAR.sidebar=[];
  CHAR.sidebar.push({type:'sep'});
  saveAll(); renderAll();
}
function deleteSidebarItem(idx){
  const item=(CHAR.sidebar||[])[idx];
  // Don't allow deleting built-in sections
  if(typeof item==='string' && SECTION_REGISTRY[item] && !SECTION_REGISTRY[item].deletable){
    toast(T('sbCantDelete'),'error'); return;
  }
  // Separators: delete without confirm (trivial to re-add)
  if(typeof item==='object' && item.type==='sep'){
    (CHAR.sidebar||[]).splice(idx,1);
    saveAll(); renderAll(); return;
  }
  if(!confirm(T('confirmDelete'))) return;
  // If deleting a custom feature section, also delete the feature
  if(typeof item==='string' && !SECTION_REGISTRY[item]){
    const fIdx=(CHAR.features||[]).findIndex(f=>slugify(f.title)===item||f.sectionId===item);
    if(fIdx>=0) CHAR.features.splice(fIdx,1);
  }
  (CHAR.sidebar||[]).splice(idx,1);
  saveAll(); renderAll();
}

}

function addCondition(){ openWizard('condition',null,{}); }
function deleteCondition(idx){
  if(!confirm(T('confirmDelete'))) return;
  (CHAR.customConditions||[]).splice(idx,1);

// Session note
function saveNote(){
  const el=document.getElementById('note-rapide');

}
// ═══════════════ MISC UI ═══════════════
function toggleTheme(){
  const root=document.documentElement;
  const newTheme=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',newTheme);
  localStorage.setItem('dnd-theme',newTheme);
  const btn=document.getElementById('btn-theme');
  if(btn) btn.textContent=newTheme==='light'?'🌙':'☀️';
  const ob=document.getElementById('overflow-theme');
  if(ob) ob.textContent=(newTheme==='light'?'🌙':'☀️')+' '+T('overflowTheme');
}
function toggleOverflowMenu(e){
  e.stopPropagation();
  document.getElementById('hdr-overflow-menu')?.classList.toggle('open');
}
function closeOverflowMenu(){
  document.getElementById('hdr-overflow-menu')?.classList.remove('open');
}
document.addEventListener('click',function(e){
  const menu=document.getElementById('hdr-overflow-menu');
  const btn=document.getElementById('hdr-overflow-btn');
  if(menu&&btn&&!menu.contains(e.target)&&e.target!==btn) closeOverflowMenu();
});
function toggleLang(){
  currentLang=currentLang==='it'?'en':'it';
  localStorage.setItem('dnd-lang',currentLang);
  renderAll();
}
function toggleEditMode(){
  EDIT_MODE=!EDIT_MODE;
  document.body.classList.toggle('edit-mode',EDIT_MODE);
  renderAll();
}
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const overlay=document.getElementById('sidebar-overlay');
  if(!sb)return;
  const open=sb.classList.toggle('open');
  if(overlay) overlay.classList.toggle('visible',open);
}
function onOverlayClick(event){
  // Close wizard if the backdrop itself was clicked (not the modal box inside)
  if(event&&event.target&&event.target.id==='wizard-overlay'){closeWizard();return;}
  const sb=document.getElementById('sidebar');
  const overlay=document.getElementById('sidebar-overlay');
  if(sb) sb.classList.remove('open');
  if(overlay) overlay.classList.remove('visible');
}
let portraitZoom=1,ptLastDist=0;
function openPortraitModal(){
  if(!SESSION?.portrait){document.getElementById('portrait-input').click();return;}
  portraitZoom=1;
  const img=document.getElementById('portrait-lightbox-img');
  img.src=SESSION.portrait;
  img.style.transform='scale(1)';
  document.getElementById('portrait-lightbox').classList.add('open');
}
function closePortraitModal(){
  document.getElementById('portrait-lightbox')?.classList.remove('open');
}
function changePortraitFromModal(){
  closePortraitModal();
  setTimeout(()=>document.getElementById('portrait-input').click(),50);
}
(function(){
  document.addEventListener('wheel',function(e){
    if(!document.getElementById('portrait-lightbox')?.classList.contains('open')) return;
    e.preventDefault();
    portraitZoom=Math.max(0.5,Math.min(5,portraitZoom+(e.deltaY<0?0.15:-0.15)));
    document.getElementById('portrait-lightbox-img').style.transform=`scale(${portraitZoom})`;
  },{passive:false});
  document.addEventListener('touchmove',function(e){if(SB_TOUCH_DRAG) sbTouchMove(e);},{passive:false});
  document.addEventListener('touchend',function(){if(SB_TOUCH_DRAG) sbTouchEnd();});
  document.addEventListener('touchmove',function(e){
    if(!document.getElementById('portrait-lightbox')?.classList.contains('open')) return;
    if(e.touches.length!==2) return;
    e.preventDefault();
    const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(ptLastDist>0){
      portraitZoom=Math.max(0.5,Math.min(5,portraitZoom+(dist-ptLastDist)*0.01));
      document.getElementById('portrait-lightbox-img').style.transform=`scale(${portraitZoom})`;
    }
    ptLastDist=dist;
  },{passive:false});
  document.addEventListener('touchend',()=>{ptLastDist=0;});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closePortraitModal();
  });
})();
function loadPortrait(event){
  const file=event?.target?.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const src=ev.target.result;
    const tmp=new Image();
    tmp.onload=function(){
      const MAX=512;
      const scale=Math.min(1,MAX/Math.max(tmp.width,tmp.height));
      const w=Math.round(tmp.width*scale), h=Math.round(tmp.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(tmp,0,0,w,h);
      SESSION.portrait=canvas.toDataURL('image/jpeg',0.8);
      const img=document.getElementById('portrait-img');
      const ph=document.getElementById('portrait-ph');
      if(img){img.src=SESSION.portrait;img.style.display='block';}
      if(ph) ph.style.display='none';
      saveAll();
    };
    tmp.src=src;
  };
  reader.readAsDataURL(file);
}
function renderSplash(){
  const set=(id,txt)=>{const e=document.getElementById(id);if(e)e.textContent=txt;};
  set('splash-sub',        T('splashSub'));
  set('splash-import-label',T('splashImport'));
  set('splash-import-desc', T('splashImportDesc'));
  set('splash-create-label',T('splashCreate'));
  set('splash-create-desc', T('splashCreateDesc'));
}
function showSplash(){
  const sp=document.getElementById('splash');
  if(sp) sp.style.display='flex';
  renderSplash();
}
function hideSplash(){
  const sp=document.getElementById('splash');
  if(sp) sp.style.display='none';
}
function logoutCharacter(){
  if(!confirm(T('confirmLogout'))) return;
  CHAR=null; SESSION=null; EDIT_MODE=false;
  document.body.classList.remove('edit-mode');
  localStorage.removeItem('dnd_sheet_v2');
  // Reset rendered content
  document.getElementById('char-name').textContent=T('splashSub');
  ['char-subtitle','char-description','char-quote','sections-area','panel','nav-links','sidebar-footer'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.innerHTML='';
  });
  const img=document.getElementById('portrait-img'); if(img){img.src='';img.style.display='none';}
  const ph=document.getElementById('portrait-ph'); if(ph) ph.style.display='';
  const sb=document.getElementById('sb-char-block'); if(sb) sb.innerHTML='';
  showSplash();
  renderSidebar();
  updateFixedControls();
}
let _toastTimer=null;
function showToast(msg,type='info',btn=null){
  const tc=document.getElementById('toast-container');
  if(!tc)return;
  const t=document.createElement('div');
  t.className='toast '+type;
  const span=document.createElement('span');span.textContent=msg;t.appendChild(span);
  if(btn){
    const b=document.createElement('button');
    b.className='toast-btn';b.textContent=btn.label;
    b.onclick=()=>{btn.fn();t.remove();};
    t.appendChild(b);
  }
  tc.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('visible'));
  setTimeout(()=>{t.classList.remove('visible');setTimeout(()=>t.remove(),400);},3200);
}
// ═══════════════ INIT ═══════════════
function init(){
  // Theme
  const savedTheme=localStorage.getItem('dnd-theme')||'dark';
  document.documentElement.setAttribute('data-theme',savedTheme);
  const themeBtn=document.getElementById('btn-theme');
  if(themeBtn) themeBtn.textContent=savedTheme==='light'?'🌙':'☀️';
  // Lang
  currentLang=localStorage.getItem('dnd-lang')||'it';
  // Load data
  const loaded=loadFromStorage();
  if(!loaded||!CHAR){
    showSplash();
    renderSidebar();
    updateFixedControls();
    return;
  }
  hideSplash();
  syncSession();
  renderAll();
  // Wizard modal close on overlay click
  // Concentration input sync
  const ci=document.getElementById('conc-spell-input');
  if(ci){
    ci.addEventListener('change',function(){
      SESSION.concentration=ci.value;
      const st=document.getElementById('conc-status');
      if(st){
        st.textContent=ci.value?ci.value:T('concNone');
        st.className='conc-status-text'+(ci.value?' conc-active':'');
      }
      saveAll();
    });
  }
  // HP amount enter key
  const hpAmt=document.getElementById('hp-amount');
  if(hpAmt) hpAmt.addEventListener('keydown',function(e){if(e.key==='Enter')applyDamage();});
  // Sidebar resize
  const savedSbW=localStorage.getItem('sidebarWidth');
  if(savedSbW) document.documentElement.style.setProperty('--sidebar-w',savedSbW);
  initSbResize();
}
// ─── SIDEBAR RESIZE ───
let _sbDrag=null;
function initSbResize(){
  const handle=document.getElementById('sb-resize');
  if(!handle) return;
  handle.addEventListener('mousedown',function(e){
    e.preventDefault();
    const sb=document.getElementById('sidebar');
    _sbDrag={startX:e.clientX,startW:sb?sb.getBoundingClientRect().width:200};
    handle.classList.add('dragging');
    document.addEventListener('mousemove',_onSbDrag);
    document.addEventListener('mouseup',_onSbDragEnd);
  });
}
function _onSbDrag(e){
  if(!_sbDrag) return;
  const newW=Math.min(320,Math.max(160,_sbDrag.startW+(e.clientX-_sbDrag.startX)));
  document.documentElement.style.setProperty('--sidebar-w',newW+'px');
}
function _onSbDragEnd(){
  if(!_sbDrag) return;
  const w=document.documentElement.style.getPropertyValue('--sidebar-w');
  if(w) localStorage.setItem('sidebarWidth',w);
  _sbDrag=null;
  document.getElementById('sb-resize')?.classList.remove('dragging');
  document.removeEventListener('mousemove',_onSbDrag);
  document.removeEventListener('mouseup',_onSbDragEnd);
}
// Splash "load file" button
function splashLoadFile(){
  document.getElementById('import-char-input')?.click();
}
// Splash "new character" button
function splashNewChar(){
  hideSplash();
  openWizard('char-create');
