<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheda D&D 2024</title>
  <style>
/* ═══════════════ THEME VARIABLES ═══════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
:root[data-theme="dark"]{
  --bg:#0f0f1a; --bg-card:#1a1a28; --bg-card2:#22223a; --bg-input:#14141f;
  --border:#3a3620; --border-light:#28263a;
  --text:#e4dfc8; --text-muted:#8a8870; --text-faint:#504e60;
  --accent:#c9a227; --accent-dim:#1e1800; --accent-glow:rgba(201,162,39,.22);
  --sidebar-bg:#0a0a14; --sidebar-text:#9a9878; --sidebar-hover:#161620;
  --shadow:0 4px 24px rgba(0,0,0,.55); --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --hp-green:#48a848; --hp-yellow:#c8a030; --hp-red:#b83030;
  --tag-green:#2a5a2a; --tag-purple:#5a2a7a; --tag-blue:#2a4a8a; --tag-red:#8a2a2a; --tag-orange:#7a5a10;
  --algo-bg:#14141f; --algo-step-bg:#1e1e2e; --algo-step-border:#2a2820;
  --log-damage:#e88888; --log-heal:#88d888;
  --modal-bg:#1a1a28; --overlay:rgba(5,5,10,.88);
  --pip-on:#c9a227; --pip-off-bg:transparent; --pip-off-border:#3a3620; --pip-text:#1a0e00;
  --death-succ:#4a9a4a; --death-fail:#9a4a4a;
  --slot1-color:#5588dd; --slot2-color:#8855dd; --slot3-color:#44aa66;
  --slot4-color:#cc5555; --slot5-color:#bbaa30; --slot6-color:#44aabb;
  --slot7-color:#bb55bb; --slot8-color:#cc7744; --slot9-color:#9999aa;
  --cond-active-bg:#4a1818; --cond-active-border:#cc5555; --cond-active-text:#f0bbbb;
  --toast-success-bg:#1a2e1a; --toast-success-border:#338833;
  --toast-err-bg:#2e1a1a; --toast-err-border:#883333;
  --toast-info-bg:#1a2230; --toast-info-border:#335588;
  --scrollbar-track:#14141f; --scrollbar-thumb:#3a3620;
  --edit-mode-color:#c9a227;
  --badge-action-bg:#162844; --badge-action-text:#7aaad8; --badge-action-border:#2a4868;
  --badge-bonus-bg:#281840; --badge-bonus-text:#a888d0; --badge-bonus-border:#3a2860;
  --badge-reaction-bg:#3a1a08; --badge-reaction-text:#d89858; --badge-reaction-border:#5a3018;
  --btn-danger-bg:#3e1a1a; --btn-danger-text:#e8aaaa; --btn-danger-border:#aa5555;
  --btn-heal-bg:#1a3a1a; --btn-heal-text:#aae0aa; --btn-heal-border:#55aa55;
  --btn-longrest-bg:#1e3a1e; --btn-longrest-border:#3a7a3a; --btn-longrest-text:#88dd88;
  --btn-shortrest-bg:#1a2a3a; --btn-shortrest-border:#3a5a8a; --btn-shortrest-text:#88aadd;
}
:root[data-theme="light"]{
  --bg:#f5f0e8; --bg-card:#faf6ec; --bg-card2:#ede8dc; --bg-input:#e4ddd0;
  --border:#b8a888; --border-light:#cdc3ac;
  --text:#1e1508; --text-muted:#5c4e34; --text-faint:#8a7c64;
  --accent:#8a6800; --accent-dim:#f0e4b8; --accent-glow:rgba(138,104,0,.15);
  --sidebar-bg:#ede4d4; --sidebar-text:#3a3020; --sidebar-hover:#e0d4b8;
  --shadow:0 2px 16px rgba(40,30,10,.12); --shadow-sm:0 1px 6px rgba(40,30,10,.08);
  --hp-green:#2e8e2e; --hp-yellow:#9a8818; --hp-red:#a02020;
  --tag-green:#2a5a2a; --tag-purple:#5a2a7a; --tag-blue:#2a4a8a; --tag-red:#8a2a2a; --tag-orange:#7a5a10;
  --algo-bg:#f0ebe0; --algo-step-bg:#faf6ec; --algo-step-border:#b8a888;
  --log-damage:#b82020; --log-heal:#2a8a2a;
  --modal-bg:#faf6ec; --overlay:rgba(20,15,5,.55);
  --pip-on:#8a6800; --pip-off-bg:#ede0c4; --pip-off-border:#b8a880; --pip-text:#faf6ec;
  --death-succ:#2e8e2e; --death-fail:#a02020;
  --slot1-color:#3366bb; --slot2-color:#7733bb; --slot3-color:#2e8e4e;
  --slot4-color:#aa3333; --slot5-color:#8a7718; --slot6-color:#228888;
  --slot7-color:#883399; --slot8-color:#995522; --slot9-color:#707088;
  --cond-active-bg:#f4dada; --cond-active-border:#cc4444; --cond-active-text:#881111;
  --toast-success-bg:#e0f0e0; --toast-success-border:#338833;
  --toast-err-bg:#f4e0e0; --toast-err-border:#883333;
  --toast-info-bg:#e0e4f0; --toast-info-border:#446688;
  --scrollbar-track:#e4ddd0; --scrollbar-thumb:#b8a888;
  --edit-mode-color:#8a6800;
  --badge-action-bg:#dce8f4; --badge-action-text:#2a5588; --badge-action-border:#aac4e0;
  --badge-bonus-bg:#e8ddf4; --badge-bonus-text:#5a3388; --badge-bonus-border:#c4aae0;
  --badge-reaction-bg:#f4e8da; --badge-reaction-text:#884a1a; --badge-reaction-border:#e0c4a0;
  --btn-danger-bg:#f4dada; --btn-danger-text:#882222; --btn-danger-border:#cc8888;
  --btn-heal-bg:#daf4da; --btn-heal-text:#226622; --btn-heal-border:#88cc88;
  --btn-longrest-bg:#d8eed8; --btn-longrest-border:#66aa66; --btn-longrest-text:#2a6a2a;
  --btn-shortrest-bg:#d8e4f0; --btn-shortrest-border:#6688aa; --btn-shortrest-text:#2a4a6a;
}
/* ═══════════════ BASE ═══════════════ */
html{scroll-behavior:smooth;}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.6;font-size:16px;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;}
h1{font-size:1.75em;margin-bottom:2px;color:var(--text);font-weight:700;letter-spacing:-.01em;}
h2{font-size:1.1em;border-bottom:1.5px solid var(--accent);padding:4px 0 7px 12px;
  border-left:4px solid var(--accent);margin-top:36px;margin-bottom:14px;
  scroll-margin-top:68px;color:var(--text);display:flex;align-items:center;
  gap:8px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
h3{font-size:1em;margin-top:16px;margin-bottom:4px;color:var(--text);font-weight:600;}
p{margin:4px 0;}
.subtitle{color:var(--text-muted);font-style:italic;margin-top:2px;font-size:.95em;}
.note{color:var(--text-muted);font-size:.92em;}
hr{border:none;border-top:1px solid var(--border-light);margin:24px 0;}
table{border-collapse:collapse;margin:10px 0;width:auto;}
td,th{border:1px solid var(--border-light);padding:7px 14px;text-align:left;font-size:.9em;}
th{background:var(--bg-card2);font-weight:600;color:var(--text);}
td{background:var(--bg-card);color:var(--text);}
ul{margin:6px 0 10px 22px;} li{margin:3px 0;}
a{color:var(--accent);text-decoration:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--scrollbar-track);}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px;}
.feature-tag{display:inline-block;color:#fff;
  font-size:.72em;padding:1px 7px;border-radius:3px;vertical-align:middle;margin-left:5px;}
.feature-tag.tag-green{background:var(--tag-green);}
.feature-tag.tag-purple{background:var(--tag-purple);}
.feature-tag.tag-blue{background:var(--tag-blue);}
.feature-tag.tag-red{background:var(--tag-red);}
.feature-tag.tag-orange{background:var(--tag-orange);}
.feature-source{display:inline-block;color:var(--text-muted);font-size:.7em;
  padding:1px 7px;border:1px solid var(--border-light);border-radius:3px;vertical-align:middle;margin-left:5px;}
.feature-subtitle{color:var(--text-muted);font-size:.9em;margin:2px 0 8px;}
.empty-state{color:var(--text-muted);font-style:italic;padding:18px 0;text-align:center;
  border:2px dashed var(--border-light);border-radius:8px;margin:10px 0;}
tr.skill-none{opacity:.55;}
.section-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.section-header h2{margin-top:0;border-bottom:none;padding-bottom:0;flex:1;}
.section-header-line{border-bottom:2px solid var(--border);margin-bottom:14px;padding-bottom:4px;}
/* ═══════════════ LAYOUT ═══════════════ */
/* ═══════════════ APP HEADER ═══════════════ */
#app-header{position:fixed;top:0;left:0;right:0;height:50px;z-index:1010;
  background:var(--bg-card);border-bottom:2px solid var(--accent);
  display:flex;align-items:center;padding:0 10px;gap:8px;box-shadow:var(--shadow-sm);}
#hamburger{display:none;background:none;border:none;color:var(--text-muted);
  font-size:1.2em;cursor:pointer;padding:5px 7px;border-radius:6px;flex-shrink:0;line-height:1;}
#hamburger:hover{background:var(--sidebar-hover);color:var(--accent);}
.hdr-logo{color:var(--accent);font-weight:800;font-size:.95em;text-decoration:none;
  white-space:nowrap;padding:2px 4px;flex-shrink:0;letter-spacing:.04em;
  text-shadow:0 0 12px rgba(201,162,39,.35);}
.hdr-logo:hover{opacity:.85;}
.hdr-tabs{display:flex;gap:2px;margin:0 6px;}
.hdr-tab{color:var(--sidebar-text);font-size:.84em;padding:5px 11px;border-radius:6px;
  text-decoration:none;font-weight:500;transition:color .15s,background .15s;white-space:nowrap;
  border-bottom:2px solid transparent;}
.hdr-tab:hover{color:var(--accent);background:var(--sidebar-hover);}
.hdr-tab.active{color:var(--accent);font-weight:700;border-bottom-color:var(--accent);border-radius:0;}
.hdr-right{display:flex;gap:5px;margin-left:auto;}
#sidebar{position:fixed;left:0;top:50px;width:var(--sidebar-w,200px);height:calc(100vh - 50px);overflow-y:auto;
  background:var(--sidebar-bg);padding:16px 0 24px;z-index:200;
  transition:transform .25s ease;display:flex;flex-direction:column;}
#sb-resize{position:absolute;right:0;top:0;width:5px;height:100%;cursor:col-resize;z-index:10;
  background:transparent;transition:background .15s;}
#sb-resize:hover,#sb-resize.dragging{background:var(--accent-glow);}
#sidebar a{display:block;color:var(--sidebar-text);text-decoration:none;
  padding:5px 14px;font-size:.82em;border-left:3px solid transparent;transition:all .15s;}
#sidebar a:hover{background:var(--sidebar-hover);color:var(--accent);border-left-color:var(--accent);}
#sidebar a.active{background:rgba(201,162,39,.1);color:var(--accent);border-left-color:var(--accent);}
.nav-sep{border-top:1px solid var(--border-light);margin:6px 0;}
.nav-sub-link{font-size:.85em!important;padding:4px 12px 4px 24px!important;opacity:.8;}
.nav-sub-link:hover{opacity:1;}
.section-sep{border:none;border-top:1px solid var(--border-light);margin:24px 0;}
#main{margin-left:var(--sidebar-w,200px);margin-top:50px;max-width:920px;padding:32px 32px 80px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:150;}
#sidebar-overlay.visible{display:block;}
@media(max-width:768px){
  #hamburger{display:flex!important;align-items:center;}
  #sidebar{transform:translateX(-100%);width:220px;z-index:220;}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;padding:16px 14px 80px;}
  h1{font-size:1.4em;}
  table{font-size:.82em;}
  td,th{padding:5px 8px;}
  .hdr-right{display:none!important;}
  .hdr-tabs{display:none!important;}
  #hdr-overflow-btn{display:flex!important;}
}
/* ── Overflow menu (mobile theme/lang) ── */
#hdr-overflow-btn{display:none;background:none;border:none;color:var(--sidebar-text);
  font-size:1.3em;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;margin-left:auto;}
#hdr-overflow-btn:hover{background:var(--sidebar-hover);color:var(--accent);}
#hdr-overflow-menu{display:none;position:fixed;top:53px;right:10px;
  background:var(--sidebar-bg);border:1px solid var(--accent);border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:2000;min-width:140px;padding:6px 0;}
#hdr-overflow-menu.open{display:block;}
.overflow-item{display:flex;align-items:center;gap:10px;width:100%;background:none;
  border:none;color:var(--sidebar-text);font-size:.9em;padding:9px 16px;cursor:pointer;
  text-align:left;transition:background .12s,color .12s;text-decoration:none;}
.overflow-item:hover{background:var(--sidebar-hover);color:var(--accent);}
/* ═══════════════ HEADER ═══════════════ */
#header-area{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;
  background:var(--bg-card);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow-sm);
  border:1px solid var(--border-light);}
.portrait-wrap{flex-shrink:0;width:96px;height:120px;border-radius:10px;
  border:1.5px solid var(--border-light);overflow:hidden;background:var(--bg-card2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,box-shadow .2s;position:relative;}
.portrait-wrap:hover{border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;display:none;}
.portrait-ph{font-size:.62em;color:var(--text-faint);text-align:center;line-height:1.7;padding:6px;}
#portrait-input{display:none;}
/* ── Portrait lightbox ── */
#portrait-lightbox{display:none;position:fixed;inset:0;z-index:3000;
  background:rgba(0,0,0,.9);flex-direction:column;align-items:center;justify-content:center;}
#portrait-lightbox.open{display:flex;}
#portrait-lightbox-img{max-width:90vw;max-height:72vh;object-fit:contain;
  border-radius:10px;transition:transform .12s;transform-origin:center;
  user-select:none;-webkit-user-drag:none;}
.portrait-lb-bar{display:flex;gap:12px;margin-top:20px;}
.portrait-lb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:7px;padding:8px 18px;cursor:pointer;font-size:.9em;
  transition:background .15s;font-family:inherit;}
.portrait-lb-btn:hover{background:rgba(255,255,255,.22);}
.portrait-lb-btn.accent{background:var(--accent);color:#1a0e00;border-color:var(--accent);}
.portrait-lb-btn.accent:hover{filter:brightness(1.1);}
.header-text{flex:1;min-width:0;}
.header-text h1{font-size:1.85em;line-height:1.2;margin-bottom:4px;}
.header-text .subtitle{margin-bottom:2px;}
.header-text .char-description{color:var(--text-muted);font-size:.9em;margin:4px 0;}
.header-text .char-quote{color:var(--text-muted);font-style:italic;font-size:.95em;
  margin-top:8px;padding-left:12px;border-left:3px solid var(--accent);}
@media(max-width:600px){
  #header-area{flex-direction:column;gap:12px;}
  .portrait-wrap{width:70px;height:88px;}
}
/* ═══════════════ PANNELLO ═══════════════ */
#game-panel{background:var(--bg-card);border-radius:14px;padding:22px 24px 26px;
  margin-bottom:32px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);
  scroll-margin-top:62px;}
.pn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:16px;}
.pn-card{background:var(--bg-card2);border-radius:10px;padding:11px 14px 13px;
  border:1px solid var(--border-light);transition:border-color .2s;}
.pn-card:hover{border-color:var(--accent);}
.pn-card .label{font-size:.68em;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--text-muted);margin-bottom:7px;font-weight:500;}
.pn-card .value-row{display:flex;align-items:center;gap:6px;}
.pn-card .big-val{font-size:1.9em;font-weight:700;color:var(--text);min-width:38px;
  text-align:center;line-height:1;}
.pn-card .max-val{font-size:.85em;color:var(--text-muted);}
.hp-bar-wrap{margin-top:9px;background:var(--bg-input);border-radius:5px;height:9px;overflow:hidden;}
.hp-bar{height:100%;border-radius:5px;transition:width .4s,background .4s;}
.hp-input-row{display:flex;gap:5px;align-items:center;margin-top:9px;flex-wrap:wrap;}
.hp-input-row input[type=number]{width:54px;background:var(--bg-input);border:1px solid var(--border-light);
  color:var(--text);border-radius:5px;padding:4px 6px;font-size:.9em;text-align:center;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
.pips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--pip-on);
  background:var(--pip-on);cursor:pointer;transition:all .15s;display:inline-flex;
  align-items:center;justify-content:center;font-size:.62em;font-weight:bold;color:var(--pip-text);
  user-select:none;}
.pip.used{background:var(--pip-off-bg);color:var(--text-faint);border-color:var(--pip-off-border);}
.pip:hover{border-color:var(--accent);transform:scale(1.1);}
.death-row{display:flex;gap:10px;align-items:center;margin-top:6px;}
.death-pips{display:flex;flex-direction:row;gap:5px;align-items:center;}
.death-pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-light);
  background:var(--bg-input);cursor:pointer;transition:all .15s;}
.death-pip.succ:not(.used){border-color:var(--death-succ);}
.death-pip.fail:not(.used){border-color:var(--death-fail);}
.death-pip.succ.used{background:var(--death-succ);border-color:var(--death-succ);}
.death-pip.fail.used{background:var(--death-fail);border-color:var(--death-fail);}
.btn-row{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.btn{background:var(--bg-card2);border:1px solid var(--border-light);color:var(--text-muted);
  border-radius:6px;padding:5px 11px;font-size:.8em;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn:hover{background:var(--accent-dim);color:var(--text);border-color:var(--accent);}
.btn.danger:hover{background:var(--btn-danger-bg);color:var(--btn-danger-text);border-color:var(--btn-danger-border);}
.btn.heal:hover{background:var(--btn-heal-bg);color:var(--btn-heal-text);border-color:var(--btn-heal-border);}
.btn.long-rest{background:var(--btn-longrest-bg);border-color:var(--btn-longrest-border);color:var(--btn-longrest-text);font-weight:600;}
.btn.long-rest:hover{filter:brightness(1.1);}
.btn.short-rest{background:var(--btn-shortrest-bg);border-color:var(--btn-shortrest-border);color:var(--btn-shortrest-text);font-weight:600;}
.btn.short-rest:hover{filter:brightness(1.1);}
.hd-qty-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
.hd-qty-row .hd-qty-val{font-size:1.4em;font-weight:700;min-width:28px;text-align:center;}
.btn-qty{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:1.1em;cursor:pointer;color:var(--text);}
.btn-qty:hover{border-color:var(--accent);}
.inline-field{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:.85em;color:var(--text-muted);}
.inline-field input{background:var(--bg-input);border:1px solid var(--border-light);color:var(--text);
  border-radius:5px;padding:3px 8px;font-size:.95em;}
.gold-row{display:flex;align-items:center;gap:7px;margin-top:7px;}
.gold-row input[type=number]{width:82px;background:var(--bg-input);border:1px solid var(--border-light);
  color:#d4aa30;border-radius:5px;padding:5px 8px;font-size:1em;font-weight:600;text-align:center;}
#log-wrap{background:var(--bg-card2);border:1px solid var(--border-light);border-radius:7px;
  padding:7px 10px;max-height:95px;overflow-y:auto;margin-top:7px;font-size:.78em;color:var(--text-muted);}
#log-wrap p{margin:2px 0;}
.log-damage{color:var(--log-damage);}
.log-heal{color:var(--log-heal);}
.round-row{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:.85em;}
.round-val{font-size:1.6em;font-weight:bold;color:var(--text);min-width:32px;text-align:center;}
.cond-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.cond-btn{background:var(--bg-card2);border:1.5px solid var(--border-light);color:var(--text-muted);
  border-radius:14px;padding:3px 11px;font-size:.78em;cursor:pointer;transition:all .15s;user-select:none;}
.cond-btn.active{background:var(--cond-active-bg);border-color:var(--cond-active-border);
  color:var(--cond-active-text);font-weight:bold;}
.cond-btn:hover{border-color:var(--accent);color:var(--text);}
.action-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;}
.filter-btn{background:var(--bg-card2);border:1.5px solid var(--border-light);color:var(--text-muted);
  border-radius:14px;padding:4px 13px;font-size:.79em;cursor:pointer;transition:all .15s;user-select:none;}
.filter-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--text);font-weight:600;}
.filter-btn:hover{border-color:var(--accent);color:var(--text);}
.action-entry{display:flex;align-items:flex-start;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--border-light);}
.action-entry:last-child{border-bottom:none;}
.action-badge{flex-shrink:0;font-size:.63em;padding:2px 8px;border-radius:10px;
  font-weight:bold;margin-top:3px;white-space:nowrap;}
.badge-azione{background:var(--badge-action-bg);color:var(--badge-action-text);border:1px solid var(--badge-action-border);}
.badge-bonus{background:var(--badge-bonus-bg);color:var(--badge-bonus-text);border:1px solid var(--badge-bonus-border);}
.badge-reazione{background:var(--badge-reaction-bg);color:var(--badge-reaction-text);border:1px solid var(--badge-reaction-border);}
.action-entry-body{flex:1;line-height:1.4;}
.action-entry-name{font-weight:bold;color:var(--text);font-size:.88em;}
.action-entry-note{color:var(--text-muted);font-size:.78em;margin-top:2px;}
#note-rapide{width:100%;background:var(--bg-card2);border:1px solid var(--border-light);
  color:var(--text);border-radius:7px;padding:8px 11px;font-size:.85em;resize:vertical;
  min-height:62px;margin-top:8px;font-family:inherit;}
#conc-spell-input{background:var(--bg-input);border:1px solid var(--border-light);color:var(--text);
  border-radius:5px;padding:3px 8px;font-size:.85em;flex:1;min-width:0;}
.conc-active{color:#d0b040;font-weight:600;}
.temp-hp-info{margin-top:6px;font-size:.79em;color:var(--text-muted);}
/* ═══════════════ SECTIONS ═══════════════ */
.spell-card{border-left:3px solid var(--accent);background:var(--bg-card);
  border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;
  box-shadow:var(--shadow-sm);transition:border-color .2s;}
.spell-card:hover{border-left-color:var(--text);}
.spell-card-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.spell-card-name{font-weight:bold;font-size:1em;color:var(--text);}
.spell-card-original{color:var(--text-muted);font-size:.82em;font-style:italic;}
.spell-card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.8em;color:var(--text-muted);margin:5px 0;}
.spell-meta-chip{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:5px;padding:1px 7px;}
.spell-meta-chip.conc{border-color:#b88020;color:#b88020;}
.spell-meta-chip.ritual{border-color:var(--accent);color:var(--accent);font-weight:600;}
.spell-card.unprepared{opacity:.45;}
.spell-card.unprepared:hover{opacity:.7;}
.spell-prepared-toggle{cursor:pointer;font-size:.85em;padding:2px 8px;border-radius:5px;
  border:1px solid var(--border-light);background:var(--bg-card2);color:var(--text-muted);
  transition:all .15s;user-select:none;white-space:nowrap;}
.spell-prepared-toggle:hover{border-color:var(--accent);color:var(--text);}
.spell-prepared-toggle.is-prepared{border-color:var(--hp-green);color:var(--hp-green);}
.spell-card-desc{font-size:.9em;color:var(--text);margin-top:5px;white-space:pre-line;}
.spell-card-scaling{font-size:.82em;color:var(--text-muted);margin-top:4px;font-style:italic;}
.spell-card-notes{font-size:.82em;color:var(--text-muted);margin-top:4px;}
.algo{background:var(--algo-bg);border:1px solid var(--border-light);border-radius:10px;
  padding:16px 18px;margin:12px 0;}
.algo-block{margin-bottom:10px;}
.algo-block-title{font-weight:bold;font-size:.95em;color:var(--accent);margin-bottom:6px;}
.algo-step{background:var(--algo-step-bg);border-left:4px solid var(--algo-step-border);
  padding:9px 13px;margin:7px 0;border-radius:0 6px 6px 0;}
.algo-step.indent{margin-left:20px;border-left-color:var(--text-faint);}
.algo-step-question{font-weight:bold;color:var(--text);margin-bottom:4px;font-size:.93em;}
.algo-step ul{margin:0 0 0 18px;}
.algo-step li{color:var(--text);font-size:.9em;}
.weapon-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:8px;
  padding:13px 15px;margin:10px 0;box-shadow:var(--shadow-sm);}
.weapon-card h3{margin-top:0;margin-bottom:6px;}
.subfeature-block{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:8px;padding:12px 14px;margin:10px 0;}
.subfeature-header{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.subfeature-title{font-weight:bold;font-size:.97em;color:var(--text);}
.spellcasting-info-box{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:8px;padding:14px 16px;margin-bottom:18px;}
.spell-level-section{margin-top:28px;}
.spell-level-title{font-size:1.1em;font-weight:bold;color:var(--text);
  border-bottom:1px solid var(--border-light);padding-bottom:4px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;scroll-margin-top:68px;}
.equip-table td:first-child{font-weight:500;}
.equip-weapon-row td{color:var(--text-muted);font-style:italic;}
/* ═══════════════ WIZARD ═══════════════ */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:1100;
  display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--modal-bg);border:1px solid var(--border-light);border-radius:14px;
  width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,.3);animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border-light);}
.modal-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.modal-title{font-size:1.1em;font-weight:bold;color:var(--text);}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:1.2em;
  cursor:pointer;padding:2px 6px;border-radius:4px;}
.modal-close:hover{background:var(--bg-card2);color:var(--text);}
.wiz-steps-dots{display:flex;gap:6px;align-items:center;}
.wiz-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .2s;}
.wiz-dot.active{background:var(--accent);transform:scale(1.3);}
.wiz-dot.done{background:var(--accent);opacity:.5;}
.wiz-step-label{font-size:.75em;color:var(--text-muted);}
.wiz-progress-bar{height:3px;background:var(--border);border-radius:2px;margin:10px 0 0;}
#wiz-progress{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%;}
.wiz-hint{font-size:.82em;color:var(--text-muted);margin:2px 0 8px;line-height:1.4;}
.wiz-step-desc{font-size:.85em;color:var(--text-muted);margin:0 0 12px;line-height:1.5;}
.wiz-preview{margin-top:18px;padding:14px;background:var(--bg-card2);border:1px dashed var(--border);border-radius:8px;}
.wiz-preview-label{font-size:.78em;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
.wiz-preview-content{pointer-events:none;}
.wiz-preview-content h2{font-size:1.1em;margin-top:0;}
.wiz-preview-content .section-header-line{margin-bottom:6px;}
.preview-meta{font-size:.88em;color:var(--text-muted);margin-top:6px;}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;}
/* Sidebar buttons always use sidebar palette regardless of theme */
#sidebar .btn-edit-sm{background:var(--sidebar-hover);border-color:var(--border-light);color:var(--sidebar-text);}
#sidebar .btn-edit-sm:hover{border-color:var(--accent);color:var(--accent);}
/* Light-mode ctrl-btn: subtle lift */
:root[data-theme="light"] .ctrl-btn{background:var(--sidebar-hover);border-color:rgba(138,104,0,.3);color:var(--sidebar-text);}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border-light);display:flex;
  justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.modal-footer-right{display:flex;gap:8px;}
.btn-primary{background:linear-gradient(135deg,#c9a227,#a07e18);border:none;
  color:#1a0e00;border-radius:7px;padding:8px 18px;font-size:.9em;cursor:pointer;
  font-weight:700;transition:all .15s;letter-spacing:.02em;}
.btn-primary:hover{background:linear-gradient(135deg,#d9b237,#b08e28);filter:brightness(1.05);}
.btn-primary.finish{background:linear-gradient(135deg,#2a8a2a,#1a6a1a);color:#fff;}
.btn-secondary{background:var(--bg-card2);border:1px solid var(--border-light);color:var(--text-muted);
  border-radius:7px;padding:8px 15px;font-size:.9em;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{border-color:var(--accent);color:var(--text);}
.btn-cancel{background:none;border:none;color:var(--text-muted);font-size:.88em;
  cursor:pointer;padding:6px 10px;border-radius:5px;}
.btn-cancel:hover{color:var(--log-damage);}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.82em;color:var(--text-muted);
  margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}
.form-group input[type=text],.form-group input[type=number],
.form-group select,.form-group textarea{width:100%;background:var(--bg-input);
  border:1px solid var(--border-light);color:var(--text);border-radius:7px;
  padding:9px 12px;font-size:.93em;font-family:inherit;transition:border-color .2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.form-group .hint{font-size:.79em;color:var(--text-faint);margin-top:4px;}
.form-group textarea{resize:vertical;min-height:80px;}
.form-group select option{background:var(--bg-card);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ability-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.ability-cell{text-align:center;}
.ability-cell label{font-size:.75em;font-weight:bold;color:var(--accent);margin-bottom:3px;}
.ability-cell input{text-align:center;width:100%;padding:6px 2px!important;}
.ability-mod{font-size:.8em;color:var(--text-muted);margin-top:3px;text-align:center;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;}
.checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.checkbox-row span{font-size:.9em;color:var(--text);}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.skill-row{display:flex;align-items:center;gap:6px;padding:3px 0;}
.skill-row label{font-size:.85em;color:var(--text);flex:1;}
.skill-row select{background:var(--bg-input);border:1px solid var(--border-light);color:var(--text);
  border-radius:5px;padding:2px 4px;font-size:.78em;}
.content-block-list{margin:8px 0;}
.cb-item{display:flex;align-items:center;gap:7px;background:var(--bg-card2);
  border:1px solid var(--border-light);border-radius:7px;padding:7px 10px;margin:5px 0;}
.cb-badge{font-size:.68em;background:var(--accent-dim);color:var(--accent);
  border-radius:4px;padding:2px 6px;white-space:nowrap;}
.cb-preview{font-size:.8em;color:var(--text-muted);flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.cb-actions{display:flex;gap:3px;}
.cb-actions button{background:none;border:none;cursor:pointer;color:var(--text-muted);
  padding:2px 5px;border-radius:4px;font-size:.85em;}
.cb-actions button:hover{background:var(--bg-card);color:var(--text);}
.cb-expanded{background:var(--bg-card2);border:1px solid var(--accent);border-radius:7px;padding:10px;margin:5px 0;}
.algo-step-editor{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:7px;padding:10px;margin:6px 0;}
.algo-bullet-row{display:flex;gap:6px;align-items:center;margin:4px 0;}
.algo-bullet-row input{flex:1;background:var(--bg-input);border:1px solid var(--border-light);
  color:var(--text);border-radius:5px;padding:4px 8px;font-size:.85em;}
.algo-bullet-row button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.9em;}

/* ═══════════════ EDIT MODE ═══════════════ */
.edit-only{display:none!important;}
body.edit-mode .edit-only{display:inline-flex!important;}
body.edit-mode .edit-only-block{display:block!important;}
body.edit-mode::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px var(--edit-mode-color);z-index:9999;opacity:.55;}
.edit-only-block{display:none!important;}
.btn-edit-sm{background:var(--bg-card2);border:1px solid var(--border-light);color:var(--text-muted);
  border-radius:5px;padding:2px 8px;font-size:.75em;cursor:pointer;transition:all .13s;
  white-space:nowrap;}
.btn-edit-sm:hover{border-color:var(--accent);color:var(--accent);}
.btn-del-sm{background:none;border:1px solid transparent;color:var(--text-faint);
  border-radius:5px;padding:2px 6px;font-size:.75em;cursor:pointer;transition:all .13s;}
.btn-del-sm:hover{border-color:#aa4444;color:#ff8888;}
.cb-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;
  border:1px solid var(--border-light);border-radius:5px;margin-bottom:4px;transition:opacity .2s;}
.cb-row.cb-dimmed{display:none;}
.item-edit-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
/* ── Sidebar edit-mode item row ── */
.sb-item-edit{display:flex;align-items:center;gap:2px;padding:1px 4px 1px 6px;
  border-left:3px solid transparent;transition:border-color .15s,background .15s;}
.sb-item-edit.drag-over{border-left-color:var(--accent);background:var(--sidebar-hover);}
.sb-item-edit.sb-touch-dragging{opacity:.45;background:var(--sidebar-hover);}
.sb-item-edit[draggable="true"]{cursor:grab;}
.sb-item-edit[draggable="true"]:active{cursor:grabbing;}
.drag-handle{color:var(--sidebar-text);opacity:.4;font-size:1em;user-select:none;
  padding:0 3px;flex-shrink:0;line-height:1;}
.sb-item-edit a{flex:1;color:var(--sidebar-text);text-decoration:none;font-size:.82em;
  padding:3px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.sb-item-edit a:hover{color:var(--text);}
.sb-item-edit .nav-sep{flex:1;border-top:1px solid var(--border-light);margin:0;}
.sb-item-edit .sep-label{flex:1;font-size:.7em;color:var(--text-faint);font-style:italic;
  padding:0 4px;}
.sb-trash-zone{display:none;margin:8px 10px;padding:10px 8px;text-align:center;
  border:2px dashed var(--border);border-radius:8px;color:var(--text-muted);font-size:.8em;
  transition:border-color .2s,color .2s,background .2s;}
.sb-trash-zone.visible{display:block;}
.sb-trash-zone.drag-over{border-color:var(--btn-danger-bg);color:var(--btn-danger-bg);
  background:rgba(200,60,60,.08);}
.sb-edit-btns{display:flex;gap:1px;flex-shrink:0;}
.sb-edit-btns .btn-del-sm{padding:1px 4px;}
.sb-edit-btns .btn-del-sm:disabled{opacity:.25;cursor:default;pointer-events:none;}
.add-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(201,162,39,.08);
  border:1px dashed var(--accent);color:var(--accent);border-radius:7px;
  padding:5px 12px;font-size:.82em;cursor:pointer;margin-top:10px;transition:all .15s;font-weight:600;}
.add-btn:hover{background:var(--accent);color:#1a0e00;}

/* ═══════════════ MISC ═══════════════ */
#splash{position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:20px;text-align:center;}
.splash-title{font-size:2.4em;font-weight:700;color:var(--accent);margin-bottom:8px;letter-spacing:-.02em;}
.splash-sub{color:var(--text-muted);font-size:1em;margin-bottom:40px;}
.splash-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.splash-btn{background:var(--bg-card);border:1.5px solid var(--border-light);color:var(--text);
  border-radius:12px;padding:20px 32px;font-size:1em;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:8px;min-width:160px;}
.splash-btn:hover{border-color:var(--accent);box-shadow:0 0 16px var(--accent-glow);transform:translateY(-2px);}
.splash-btn-icon{font-size:2em;}
.splash-btn-label{font-weight:bold;}
.splash-btn-desc{font-size:.8em;color:var(--text-muted);}
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;
  flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--bg-card);border:1px solid var(--border-light);border-radius:9px;
  padding:11px 16px;font-size:.85em;color:var(--text);box-shadow:var(--shadow);
  animation:toastIn .3s ease;max-width:300px;pointer-events:all;}
.toast.success{border-color:var(--toast-success-border);background:var(--toast-success-bg);}
.toast.error{border-color:var(--toast-err-border);background:var(--toast-err-bg);}
.toast.info{border-color:var(--toast-info-border);background:var(--toast-info-bg);}
.toast{display:flex;align-items:center;gap:8px;}
.toast-btn{background:none;border:1px solid currentColor;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.8em;white-space:nowrap;color:inherit;opacity:.85;flex-shrink:0;}
.toast-btn:hover{opacity:1;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
/* ── Sidebar character block ── */
.sb-char-block{padding:10px 12px 8px;border-bottom:1px solid var(--border-light);}
.sb-char-info{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px 6px;transition:background .15s;}
.sb-char-info:hover{background:var(--sidebar-hover);}
.sb-portrait{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:1.5px solid var(--border-light);}
.sb-portrait-ph{width:32px;height:32px;border-radius:50%;background:var(--bg-card2);
  border:1.5px solid var(--border-light);display:flex;align-items:center;
  justify-content:center;font-size:.95em;flex-shrink:0;}
.sb-char-text{flex:1;min-width:0;}
.sb-char-name{font-size:.84em;font-weight:600;color:var(--text);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-char-sub{font-size:.71em;color:var(--text-muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-change-char{width:100%;background:none;border:1px solid var(--border-light);
  border-radius:5px;color:var(--text-muted);font-size:.71em;padding:3px 8px;
  cursor:pointer;text-align:center;transition:border-color .15s,color .15s;display:block;}
.sb-change-char:hover{border-color:var(--accent);color:var(--accent);}
/* ── Sidebar edit button ── */
.sb-edit-btn{width:100%;background:none;border:1.5px solid var(--border-light);border-radius:7px;
  color:var(--text-muted);font-size:.78em;padding:7px 12px;cursor:pointer;
  transition:all .18s;font-family:inherit;text-align:center;display:block;margin-top:4px;}
.sb-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.sb-edit-btn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600;}
.ctrl-btn{background:var(--sidebar-hover);border:1px solid rgba(201,162,39,.3);color:var(--sidebar-text);
  border-radius:8px;padding:7px 11px;font-size:.9em;cursor:pointer;transition:all .15s;
  box-shadow:var(--shadow-sm);text-decoration:none;display:inline-flex;align-items:center;
  font-family:inherit;white-space:nowrap;}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent);}
.ctrl-btn.active{background:rgba(201,162,39,.15);border-color:var(--accent);color:var(--accent);}
/* ── FAB ── */
#fab-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#fab-btn{width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1.5em;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35);transition:transform .15s,background .15s;line-height:1;}
#fab-btn:hover{background:var(--accent-hover,var(--accent));transform:scale(1.08);}
#fab-btn.open{transform:rotate(45deg);}
#fab-menu{display:none;flex-direction:column;align-items:flex-end;gap:6px;margin-bottom:4px;}
#fab-menu.open{display:flex;}
.fab-item{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:.88em;cursor:pointer;color:var(--text);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:border-color .12s,color .12s;}
.fab-item:hover{border-color:var(--accent);color:var(--accent);}
/* ── Getting Started Card ── */
.gs-card{background:var(--bg-card);border:2px solid var(--accent);border-radius:12px;padding:20px 24px;margin-bottom:24px;max-width:660px;}
.gs-card h3{margin:0 0 6px;color:var(--accent);font-size:1.1em;}
.gs-card p{margin:0 0 14px;color:var(--text-muted);font-size:.9em;}
.gs-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.gs-btn{background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--text);font-size:.88em;transition:background .12s;}
.gs-btn:hover{background:var(--accent);color:#fff;}
.gs-dismiss{background:none;border:none;color:var(--text-muted);font-size:.82em;cursor:pointer;text-decoration:underline dotted;padding:0;}
.gs-dismiss:hover{color:var(--text);}
/* ── Level-Up Checklist Card ── */
.lu-card{background:var(--bg-card);border:2px solid var(--accent);border-radius:12px;padding:20px 24px;margin-bottom:24px;max-width:660px;}
.lu-card h3{margin:0 0 4px;color:var(--accent);font-size:1.05em;}
.lu-card .lu-sub{color:var(--text-muted);font-size:.85em;margin:0 0 14px;}
.lu-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-light);cursor:pointer;}
.lu-item:last-of-type{border-bottom:none;}
.lu-item input[type=checkbox]{margin-top:2px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.lu-item label{cursor:pointer;font-size:.92em;line-height:1.4;}
.lu-item.done label{text-decoration:line-through;color:var(--text-muted);}
.lu-footer{display:flex;justify-content:flex-end;margin-top:12px;}
.lu-dismiss{background:none;border:none;color:var(--text-muted);font-size:.82em;cursor:pointer;text-decoration:underline dotted;}
.lu-dismiss:hover{color:var(--text);}
.sidebar-footer{margin-top:auto;padding:8px 12px 4px;border-top:1px solid var(--border-light);}
.sidebar-footer .btn-edit-sm{width:100%;justify-content:center;margin:3px 0;}
.conc-status-text{margin-top:4px;font-size:.8em;color:var(--text-muted);}
@media(max-width:500px){.ability-grid{grid-template-columns:repeat(3,1fr);}
  .form-row{grid-template-columns:1fr;} .form-row-3{grid-template-columns:1fr 1fr;}
  .skills-grid{grid-template-columns:1fr;} .splash-title{font-size:1.7em;}}
.spells-section-header{display:flex;align-items:center;gap:10px;}
.slot-pip-inline{width:12px;height:12px;border-radius:50%;display:inline-block;margin:0 1px;}
.section-actions{display:flex;align-items:center;gap:6px;}
/* ═══════════════ ABILITY BUY WIDGET ═══════════════ */
.ab-widget{margin-top:4px;}
.ab-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.ab-header label{font-size:.82em;color:var(--text-muted);font-weight:500;}
.ab-budget-input{width:60px;background:var(--bg-input);border:1px solid var(--border-light);
  color:var(--text);border-radius:5px;padding:4px 6px;font-size:.9em;text-align:center;}
.ab-remaining{font-size:.88em;color:var(--text);margin-left:auto;}
.ab-remaining strong{font-size:1.15em;}
.ab-remaining.over{color:var(--btn-danger-text);}
.ab-bar{height:6px;background:var(--bg-input);border-radius:3px;margin-bottom:14px;overflow:hidden;}
.ab-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .2s,background .2s;}
.ab-bar-fill.over{background:var(--hp-red);}
.ab-grid{display:flex;flex-direction:column;gap:6px;}
.ab-row{display:flex;align-items:center;gap:8px;background:var(--bg-card2);
  border:1px solid var(--border-light);border-radius:8px;padding:8px 12px;}
.ab-name{font-weight:600;font-size:.9em;min-width:38px;color:var(--text);}
.ab-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-light);
  background:var(--bg-card);color:var(--text);font-size:1.1em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
  font-weight:bold;line-height:1;user-select:none;}
.ab-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.ab-btn:disabled{opacity:.25;cursor:default;pointer-events:none;}
.ab-val{width:44px;background:var(--bg-input);border:1px solid var(--border-light);
  color:var(--text);border-radius:6px;padding:5px;font-size:1.05em;text-align:center;
  font-weight:700;font-variant-numeric:tabular-nums;}
.ab-mod{font-size:.88em;color:var(--text-muted);min-width:36px;text-align:center;
  font-variant-numeric:tabular-nums;}
.ab-cost{font-size:.75em;color:var(--text-faint);min-width:40px;text-align:right;}
.ab-ref{margin-top:12px;font-size:.75em;color:var(--text-faint);line-height:1.6;}
.ab-mode{font-size:.82em;color:var(--accent);cursor:pointer;background:none;
  border:1px solid var(--border-light);border-radius:5px;padding:3px 10px;transition:all .15s;}
.ab-mode:hover{border-color:var(--accent);}
/* ═══════════════ INSPIRATION / EXHAUSTION / CURRENCY ═══════════════ */
.inspiration-btn{width:100%;padding:6px 10px;border-radius:8px;border:1.5px solid var(--border-light);
  background:var(--bg-card2);color:var(--text-muted);font-size:.88em;cursor:pointer;
  transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;}
.inspiration-btn.active{border-color:#c8a030;background:#2a2000;color:#e8c850;}
:root[data-theme="light"] .inspiration-btn.active{background:#fff8d8;color:#8a6800;border-color:#c8a030;}
.exhaustion-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.exhaustion-val{font-size:1.2em;font-weight:700;min-width:20px;text-align:center;color:var(--text);}
.exhaustion-val.danger{color:var(--hp-red);}
.exhaustion-penalty{font-size:.75em;color:var(--text-muted);flex:1;}
/* Currency card */
.cur-rows{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
.cur-row{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 6px;
  border-radius:6px;font-size:.8em;cursor:pointer;border:1px solid var(--border-light);
  background:var(--bg-card2);transition:background .1s;min-width:36px;}
.cur-row:hover{border-color:var(--accent);}
.cur-row.cur-sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.cur-name{font-size:.65em;font-weight:700;color:var(--text-muted);letter-spacing:.03em;}
.cur-row.cur-sel .cur-name{color:#ffffffcc;}
.cur-val{font-weight:700;font-variant-numeric:tabular-nums;}
.cur-controls{display:flex;align-items:center;gap:4px;}
.cur-step{width:38px;text-align:center;background:var(--bg-input);border:1px solid var(--border-light);
  color:var(--text);border-radius:4px;padding:2px;font-size:.8em;}
.cur-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-light);
  background:var(--bg-card2);color:var(--text);cursor:pointer;font-size:.95em;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;}
.cur-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
/* Passive scores */
.passive-scores-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.passive-score-box{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:7px;padding:6px 8px;text-align:center;}
.passive-score-val{font-size:1.3em;font-weight:700;color:var(--accent);}
.passive-score-lbl{font-size:.65em;color:var(--text-muted);line-height:1.3;margin-top:1px;}
/* Spell filter bar */
.spell-filter-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;}
.spell-filter-bar input{flex:1;min-width:130px;background:var(--bg-input);border:1px solid var(--border-light);
  color:var(--text);border-radius:6px;padding:5px 10px;font-size:.88em;}
.spell-filter-bar input:focus{border-color:var(--accent);outline:none;}
.spell-filter-btn{padding:3px 10px;border-radius:5px;border:1px solid var(--border-light);
  background:var(--bg-card2);color:var(--text-muted);font-size:.8em;cursor:pointer;transition:all .15s;}
.spell-filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
/* Spell components badge */
.spell-comp-badge{font-size:.7em;font-weight:700;padding:1px 5px;border-radius:3px;
  background:var(--bg-card2);border:1px solid var(--border-light);color:var(--text-muted);margin-right:2px;}
/* Mastery badge */
.mastery-chip{font-size:.75em;padding:1px 8px;border-radius:4px;
  border:1px solid var(--accent-dim);color:var(--accent);background:var(--accent-dim);
  position:relative;cursor:help;}
.mastery-chip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);
  left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);padding:5px 9px;border-radius:6px;font-size:.85em;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;z-index:210;
  box-shadow:0 2px 8px rgba(0,0,0,.25);}
.mastery-chip:hover::after{opacity:1;}
/* Attunement badge */
.attune-chip{font-size:.72em;padding:1px 7px;border-radius:4px;
  background:var(--tag-purple);color:#fff;}
/* Lore section */
.lore-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:600px){.lore-grid{grid-template-columns:1fr;}}
.lore-card{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:8px;padding:10px 14px;}
.lore-label{font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-muted);margin-bottom:4px;}
.lore-value{font-size:.93em;color:var(--text);line-height:1.5;white-space:pre-wrap;}
.lore-appearance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
@media(max-width:500px){.lore-appearance{grid-template-columns:repeat(2,1fr);}}
.lore-app-item{background:var(--bg-card2);border:1px solid var(--border-light);
  border-radius:6px;padding:6px 10px;text-align:center;}
.lore-app-lbl{font-size:.65em;color:var(--text-muted);letter-spacing:.05em;}
.lore-app-val{font-size:.9em;font-weight:600;color:var(--text);}
  </style>
</head>

  <hr>

<div id="splash">

  </div>

</div>

<!-- WIZARD MODAL -->
<div id="wizard-overlay" class="overlay" style="display:none" onclick="onOverlayClick(event)">

      <div class="modal-title-row">
        <span class="modal-title" id="wiz-title">Wizard</span>
        <button class="modal-close" onclick="closeWizard()">✕</button>

      <div style="display:flex;align-items:center;justify-content:space-between;">

        <button class="btn-primary finish" id="wiz-finish" onclick="wizFinish()" style="display:none">✓ Salva</button>

const SAVE_KEY = 'dnd_sheet_v2';

let SPELL_FILTER={text:'', school:'', action:'', prepared:false};

function abilityMod(score){return Math.floor((score-10)/2);}
function modStr(m){return (m>=0?'+':'')+m;}
// D&D 2024: PB = 2 + floor((level-1)/4), levels 1-4→+2, 5-8→+3, 9-12→+4, 13-16→+5, 17-20→+6
function computedPB(level){return 2+Math.floor((Math.max(1,level||1)-1)/4);}
// Normalize legacy IT action type keys to canonical EN keys (backward compat with old JSON)
function normalizeActionType(t){
  return {azione:'action',reazione:'reaction',gratuita:'free',bonus:'bonus',action:'action',reaction:'reaction',free:'free'}[t]||t||'action';
}
function md(text){
  if(!text) return '';
  return String(text)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}
function createDefaultSession(char){
  const s={
    hp:{current: char?.hp?.max||10, temp:0, aidBonus:0},
    hitDice:{used:0},
    trackers:{},
    spellSlots:{},
    currency:{pp:0,gp:0,ep:0,sp:0,cp:0},
    inspiration:false, exhaustion:0,
    round:1, concentration:'', initiative:'',
    conditions:[], deathSucc:0, deathFail:0,
    notes:'', portrait:null, logEntries:[]
  };
  (char?.trackers||[]).forEach(t=>{ s.trackers[t.id]={used:0}; });
  (char?.spellSlots||[]).forEach(sl=>{ s.spellSlots[sl.level]={used:0}; });
  return s;
}
function syncSession(){
  if(!SESSION||!CHAR) return;
  if(!SESSION.hp) SESSION.hp={current:CHAR.hp?.max||10,temp:0,aidBonus:0};
  if(!SESSION.hitDice) SESSION.hitDice={used:0};
  if(!SESSION.trackers) SESSION.trackers={};
  if(!SESSION.spellSlots) SESSION.spellSlots={};
  // Migrate single gold → currency
  if(SESSION.gold!=null && SESSION.currency==null){
    SESSION.currency={pp:0,gp:Math.max(0,SESSION.gold||0),ep:0,sp:0,cp:0};
    delete SESSION.gold;
  }
  if(!SESSION.currency) SESSION.currency={pp:0,gp:0,ep:0,sp:0,cp:0};
  if(SESSION.inspiration==null) SESSION.inspiration=false;
  if(SESSION.exhaustion==null) SESSION.exhaustion=0;
  // Equipment-based trackers
  (CHAR.equipment||[]).forEach(e=>{ if(e.tracked){ const tid='eq-'+slugify(e.name); if(tid && !SESSION.trackers[tid]) SESSION.trackers[tid]={used:0}; } });
  // Feature-embedded trackers (plural array)
  (CHAR.features||[]).forEach(f=>{ (f.trackers||[]).forEach(t=>{ const tid=slugify(t.label||f.title); if(tid && !SESSION.trackers[tid]) SESSION.trackers[tid]={used:0}; }); });
  (CHAR.spellSlots||[]).forEach(sl=>{ if(!SESSION.spellSlots[sl.level]) SESSION.spellSlots[sl.level]={used:0}; });
  // Migrate levelUpChecklist from SESSION → CHAR (old saves)
  if(SESSION.levelUpChecklist && !CHAR.levelUpChecklist){
    CHAR.levelUpChecklist=SESSION.levelUpChecklist;
  }
  delete SESSION.levelUpChecklist;
  // Remove stale tracker entries (deleted equipment/features)
  const validTrackerIds=new Set();
  (CHAR.equipment||[]).forEach(e=>{ if(e.tracked) validTrackerIds.add('eq-'+slugify(e.name)); });
  (CHAR.features||[]).forEach(f=>{ (f.trackers||[]).forEach(t=>{ validTrackerIds.add(slugify(t.label||f.title)); }); });
  Object.keys(SESSION.trackers).forEach(id=>{ if(!validTrackerIds.has(id)) delete SESSION.trackers[id]; });
  // Remove stale spell slot entries (deleted slots)
  const validSlotLevels=new Set((CHAR.spellSlots||[]).map(sl=>sl.level));
  Object.keys(SESSION.spellSlots).forEach(lv=>{ if(!validSlotLevels.has(+lv)) delete SESSION.spellSlots[lv]; });
}
function saveAll(){
  if(!CHAR) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      version:SCHEMA_VERSION, savedAt:new Date().toISOString(),
      character:CHAR, session:SESSION
    }));
  }catch(e){console.warn('localStorage full',e);}
}
function loadFromStorage(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.character) return false;
    CHAR=data.character;
    SESSION=data.session||createDefaultSession(CHAR);
    syncSession();
    return true;
  }catch(e){return false;}
}
function buildExportData(){
  return {version:SCHEMA_VERSION,savedAt:new Date().toISOString(),character:CHAR,session:SESSION};
}

function slugify(str){
  return (str||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
// All sections that can appear as sidebar links — built-ins always present, features added dynamically
// SECTION_REGISTRY: maps section IDs → render function + metadata
// render functions are assigned after they're defined (see below)
const SECTION_REGISTRY = {
  'game-panel': { label:()=>T('panelTitle'), emoji:'🎮', deletable:false },
  'base-data':  { label:()=>T('baseData'),   emoji:'🧬', deletable:false },
  'skills':     { label:()=>T('skills'),     emoji:'🎯', deletable:false },
  'spells':     { label:()=>T('spells'),     emoji:'✨', deletable:false,
                  hiddenWhen:()=>!EDIT_MODE&&!CHAR?.spellcasting&&!(CHAR?.spells?.length) },
  'weapons':    { label:()=>T('weapons'),    emoji:'⚔️', deletable:false },
  'equipment':  { label:()=>T('equipment'),  emoji:'🎒', deletable:false },
  'algorithm':  { label:()=>T('algorithm'),  emoji:'⚡', deletable:false,
                  hiddenWhen:()=>!(CHAR?.combatAlgorithm?.length)&&!EDIT_MODE },
  'character-lore':{ label:()=>T('characterLore'), emoji:'📖', deletable:false,
                  hiddenWhen:()=>!CHAR?.lore&&!EDIT_MODE },
};
const BUILTIN_SECTION_IDS = Object.keys(SECTION_REGISTRY);
const DEFAULT_SIDEBAR = ['game-panel','base-data','skills','spells','weapons','equipment','character-lore','algorithm'];
// Helper: build section <h2> header with emoji from registry
function sectionHeader(sectionId, extra=''){
  const reg=SECTION_REGISTRY[sectionId];
  if(!reg) return '';
  return `<h2 id="${sectionId}">${reg.emoji} ${reg.label()}${extra}</h2>`;
}

// Resolve a sidebar item to {id, label, emoji, deletable, isFeature, featureIdx}
function resolveSidebarItem(item) {
  if(typeof item==='object' && item.type==='sep') return {type:'sep'};
  // Support both string IDs (v3) and legacy {id,label,emoji} objects
  const id = typeof item==='string' ? item : item?.id;
  if(!id) return null;
  const reg = SECTION_REGISTRY[id];
  if(reg) return {id, label:reg.label(), emoji:reg.emoji, deletable:reg.deletable, hidden:reg.hiddenWhen?.()};
  // Check custom features
  const fIdx = (CHAR?.features||[]).findIndex(f=>slugify(f.title)===id || f.sectionId===id);
  if(fIdx>=0) {
    const f=CHAR.features[fIdx];
    return {id, label:f.title||'', emoji:f.emoji||'📄', deletable:true, isFeature:true, featureIdx:fIdx};
  }
  // Legacy: if item has label/emoji from old format, use those
  if(typeof item==='object' && item.label) return {id, label:item.label, emoji:item.emoji||'', deletable:true};
  return null;
}

// Ensure CHAR.sidebar has all visible built-in sections + feature entries
function ensureSidebar(){
  if(!CHAR) return;
  if(!CHAR.sidebar) CHAR.sidebar=[...DEFAULT_SIDEBAR];
  // Migrate legacy {id,label,emoji} objects to plain ID strings
  CHAR.sidebar = CHAR.sidebar.map(item=>{
    if(typeof item==='object' && item.type==='sep') return item;
    if(typeof item==='object' && item.id) return item.id;
    return item;
  });
  const existing=new Set(CHAR.sidebar.filter(i=>typeof i==='string'));
  // Add missing built-in sections (in default order, at the end)
  BUILTIN_SECTION_IDS.forEach(id=>{
    if(!existing.has(id)){
      const reg=SECTION_REGISTRY[id];
      if(!reg.hiddenWhen || !reg.hiddenWhen()){
        CHAR.sidebar.push(id);
      }
    }
  });
  // Add missing features
  (CHAR.features||[]).forEach(f=>{
    const fId=slugify(f.title);
    if(fId && !existing.has(fId)) CHAR.sidebar.push(fId);
  });
  // Remove entries for deleted features (IDs not in registry and not matching any feature)
  CHAR.sidebar = CHAR.sidebar.filter(item=>{
    if(typeof item==='object') return true; // separators
    if(SECTION_REGISTRY[item]) return true; // built-in
    // Check if it's a valid feature
    return (CHAR.features||[]).some(f=>slugify(f.title)===item || f.sectionId===item);
  });
}

function moveSidebarItem(idx,dir){

// ── Sidebar touch drag (mobile) ──
function sbTouchStart(e,idx){
  if(!EDIT_MODE) return;
  e.stopPropagation();
  SB_TOUCH_DRAG={fromIdx:idx,targetIdx:null};
  const items=document.querySelectorAll('.sb-item-edit');
  if(items[idx]) items[idx].classList.add('sb-touch-dragging');
  const trash=document.getElementById('sb-trash');
  if(trash) trash.classList.add('visible');
}
function sbTouchMove(e){
  if(!SB_TOUCH_DRAG) return;
  e.preventDefault();
  const touch=e.touches[0];
  const items=[...document.querySelectorAll('.sb-item-edit')];
  items.forEach(el=>el.classList.remove('drag-over'));
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  const item=el?.closest('.sb-item-edit');
  const trash=document.getElementById('sb-trash');
  if(item){
    const idx=items.indexOf(item);
    if(idx!==-1&&idx!==SB_TOUCH_DRAG.fromIdx){item.classList.add('drag-over');SB_TOUCH_DRAG.targetIdx=idx;}
    else SB_TOUCH_DRAG.targetIdx=null;
    if(trash) trash.classList.remove('drag-over');
  } else if(trash){
    const r=trash.getBoundingClientRect();
    const over=touch.clientX>=r.left&&touch.clientX<=r.right&&touch.clientY>=r.top&&touch.clientY<=r.bottom;
    trash.classList.toggle('drag-over',over);
    SB_TOUCH_DRAG.targetIdx=over?'trash':null;
  }
}
function sbTouchEnd(){
  if(!SB_TOUCH_DRAG) return;
  const{fromIdx,targetIdx}=SB_TOUCH_DRAG;
  SB_TOUCH_DRAG=null;
  document.querySelectorAll('.sb-item-edit').forEach(el=>el.classList.remove('drag-over','sb-touch-dragging'));
  const trash=document.getElementById('sb-trash');
  if(trash) trash.classList.remove('visible','drag-over');
  if(targetIdx==='trash'){deleteSidebarItem(fromIdx);}
  else if(targetIdx!==null&&targetIdx!==fromIdx){
    const arr=CHAR.sidebar||[];
    const[moved]=arr.splice(fromIdx,1);
    arr.splice(targetIdx,0,moved);
    CHAR.sidebar=arr;saveAll();renderSidebar();renderSections();
  }
}

  ensureSidebar();
  // ── Character identity block ──
  const portraitSrc=SESSION?.portrait||'';
  const cName=CHAR.name||'';
  const cClass=CHAR.class?dndTr('classes',CHAR.class):'';
  const cLvl=CHAR.level?T('level')+' '+CHAR.level:'';
  const cSub=[cClass,cLvl].filter(Boolean).join(' · ');
  const portraitEl=portraitSrc
    ?`<img class="sb-portrait" src="${portraitSrc}" alt="">`
    :`<div class="sb-portrait-ph">🧙</div>`;
  if(charBlock){
    charBlock.innerHTML=`<div class="sb-char-info" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="${T('titleHome')}">${portraitEl}<div class="sb-char-text">
      <div class="sb-char-name">${cName}</div>${cSub?`<div class="sb-char-sub">${cSub}</div>`:''}
    </div></div>
    <button class="sb-change-char" onclick="logoutCharacter()" title="${T('titleHome')}">↩ ${T('changeChar')}</button>
    <button class="sb-edit-btn${EDIT_MODE?' on':''}" onclick="toggleEditMode()" title="${T('titleEdit')}">${EDIT_MODE?T('editDone'):T('editMode')}</button>`;
  }
  let html='';
  if(EDIT_MODE){
    html+=(CHAR.sidebar||[]).map((item,i)=>{
      const dAttr=`draggable="true" ondragstart="sbDragStart(event,${i})" ondragover="sbDragOver(event,${i})" ondrop="sbDrop(event,${i})" ondragend="sbDragEnd()"`;
      if(typeof item==='object' && item.type==='sep'){
        return `<div class="sb-item-edit" ${dAttr}><span class="drag-handle" ontouchstart="sbTouchStart(event,${i})">⋮⋮</span><span class="sep-label">────</span></div>`;
      }
      const resolved=resolveSidebarItem(item);
      if(!resolved) return '';
      return `<div class="sb-item-edit" ${dAttr}><span class="drag-handle" ontouchstart="sbTouchStart(event,${i})">⋮⋮</span><a href="#${resolved.id}" onclick="closeSidebarMobile()">${resolved.emoji||''} ${resolved.label||''}</a></div>`;
    }).join('');
    html+=`<div class="sb-trash-zone" id="sb-trash" ondragover="sbTrashOver(event)" ondragleave="sbTrashLeave(event)" ondrop="sbTrashDrop(event)">${T('sbTrashLabel')}</div>`;
  } else {
    html+=(CHAR.sidebar||[]).map((item,i)=>{
      if(typeof item==='object' && item.type==='sep') return `<div class="nav-sep"></div>`;
      const resolved=resolveSidebarItem(item);
      if(!resolved || resolved.hidden) return '';
      let link=`<a href="#${resolved.id}" onclick="closeSidebarMobile()">${resolved.emoji||''} ${resolved.label||''}</a>`;
      if(resolved.id==='spells'){
        const levels=[...new Set((CHAR.spells||[]).map(s=>s.level))].sort((a,b)=>a-b);
        levels.forEach(lv=>{
          const label=lv===0?T('cantrips'):`${T('spellLvPrefix')} ${lv}${T('lvSuffix')}`;
          link+=`<a href="#spell-lv-${lv}" class="nav-sub-link" onclick="closeSidebarMobile()">&nbsp;&nbsp;${label}</a>`;
        });
      }
      return link;
    }).join('');
  }
  links.innerHTML=html;
  // ── Footer: action buttons (edit mode only) ──
  let footerHtml='';
  if(EDIT_MODE){
    footerHtml=`<button class="btn-edit-sm edit-only" style="display:inline-flex;width:100%;margin:2px 0;justify-content:center;" onclick="addFeature()">${T('addFeature')}</button>
      <button class="btn-edit-sm edit-only" style="display:inline-flex;width:100%;margin:2px 0;justify-content:center;" onclick="addSidebarSep()">${T('addSep')}</button>`;
  }
  footer.innerHTML=footerHtml;
}

function renderGamePanelSection(){

}

function buildPanel(){
  const S=SESSION, C=CHAR;
  const effMax=(C.hp?.max||0)+(S.hp?.aidBonus||0);
  const hpCurr=S.hp?.current??0;
  const hpPct=effMax>0?Math.max(0,Math.min(100,(hpCurr/effMax)*100)):0;
  const hpColor=hpPct>50?'var(--hp-green)':hpPct>25?'var(--hp-yellow)':'var(--hp-red)';

  // ── HP Card ──
  const hpCard=`<div class="pn-card" style="grid-column:span 2;">
    <div class="label">${T('hp')}</div>
    <div class="value-row">
      <div class="big-val" id="hp-curr">${hpCurr}</div>
      <div class="max-val">/ <span id="hp-max-disp">${effMax}</span></div>
    </div>
    <div class="hp-bar-wrap"><div class="hp-bar" id="hp-bar" style="width:${hpPct}%;background:${hpColor};"></div></div>
    <div class="hp-input-row">
      <input type="number" id="hp-amount" placeholder="val" min="1">
      <button class="btn danger" onclick="applyDamage()">${T('damage')}</button>
      <button class="btn heal" onclick="applyHeal()">${T('heal')}</button>
      <button class="btn heal" onclick="applyTempHP()">${T('tempHPBtn')}</button>
    </div>
    <div class="temp-hp-info">${T('tempHP')}: <span id="temp-hp-disp" style="color:var(--accent);font-weight:bold;">${S.hp?.temp||0}</span>
    &nbsp;|&nbsp;${T('aidBonus')}: <span id="aid-disp" style="color:var(--edit-mode-color);font-weight:600;cursor:pointer;text-decoration:underline dotted;" onclick="setAidBonus()">${modStr(S.hp?.aidBonus||0)}</span></div>
    <button class="inspiration-btn${S.inspiration?' active':''}" onclick="toggleInspiration()" style="margin-top:8px;">✨ ${T('inspiration')}</button>
  </div>`;

  // ── HD Card ──
  const hdUsed=S.hitDice?.used||0;
  const hdLabel=`d${C.hitDieType||8}`;
  let hdPips=''; for(let i=0;i<(C.level||1);i++) hdPips+=`<div class="pip${i<hdUsed?' used':''}" title="${hdLabel}" onclick="clickHDPip(${i})">${hdLabel}</div>`;
  const hdCard=`<div class="pn-card">
    <div class="label">${T('hitDice')} (${hdLabel})</div>
    <div class="pips" id="hd-pips">${hdPips}</div>
    <div class="btn-row">
      <button class="btn heal" onclick="spendHD()">${T('spendFull')}</button>
      <button class="btn" onclick="resetHD()">${T('reset')}</button>
    </div>
    <div style="margin-top:4px;font-size:.75em;color:var(--text-muted);">${T('hdNote')}</div>
  </div>`;

  // ── Death Saves ──
  const ds=S;
  let dSucc='',dFail='';
  for(let i=0;i<3;i++){dSucc+=`<div class="death-pip succ${i<(ds.deathSucc||0)?' used':''}" onclick="toggleDeathPip(this,'succ',${i})"></div>`;}
  for(let i=0;i<3;i++){dFail+=`<div class="death-pip fail${i<(ds.deathFail||0)?' used':''}" onclick="toggleDeathPip(this,'fail',${i})"></div>`;}
  const deathCard=`<div class="pn-card">
    <div class="label">${T('deathSaves')}</div>
    <div class="death-row"><span style="font-size:.8em;color:var(--death-succ);">✅</span><div class="death-pips" id="death-succ">${dSucc}</div></div>
    <div class="death-row"><span style="font-size:.8em;color:var(--death-fail);">❌</span><div class="death-pips" id="death-fail">${dFail}</div></div>
    <div class="btn-row"><button class="btn" onclick="resetDeathSaves()">${T('reset')}</button></div>
  </div>`;

  return `<div class="pn-grid">${hpCard}${hdCard}${deathCard}</div>${buildPanelRow2()}${buildPanelRow3()}${buildPanelBottom()}`;
}
// ─── Pannello Row 2: custom trackers + spell slots ───
function buildPanelRow2(){
  let cards='';
  // Equipment trackers (tracked items like potions)
  (CHAR.equipment||[]).forEach((e,i)=>{
    if(!e.tracked) return;
    const tid='eq-'+slugify(e.name);
    const used=SESSION.trackers?.[tid]?.used||0;
    const total=e.quantity||1;
    const emoji=e.emoji||'📦';
    let pips=''; for(let j=0;j<total;j++) pips+=`<div class="pip${j<used?' used':''}" onclick="clickTrackerPip('${tid}',${j})">${emoji}</div>`;
    const useBtn=e.isPotion
      ?`<button class="btn danger" onclick="usePotionTracker('${tid}')">${T('spend')} (${e.potionFormula||''})</button>`
      :`<button class="btn danger" onclick="useTracker('${tid}')">${T('spend')}</button>`;
    cards+=`<div class="pn-card" id="tracker-card-${tid}">
      <div class="label">${emoji} ${e.name||''}</div>
      <div class="pips" id="pips-${tid}">${pips}</div>
      <div class="btn-row">${useBtn}<button class="btn" onclick="resetTracker('${tid}')">${T('reset')} (${total})</button></div>
    </div>`;
  });
  // Feature-embedded trackers (v3: plural trackers[] array)
  (CHAR.features||[]).forEach(f=>{
    (f.trackers||[]).forEach(t=>{
      const label=t.label||f.title;
      const emoji=t.emoji||f.emoji;
      const tid=slugify(label);
      const used=SESSION.trackers?.[tid]?.used||0;
      const total=t.total||1;
      let pips=''; for(let j=0;j<total;j++) pips+=`<div class="pip${j<used?' used':''}" onclick="clickTrackerPip('${tid}',${j})">${t.showDie&&t.die?t.die:(emoji||'●')}</div>`;
      cards+=`<div class="pn-card" id="tracker-card-${tid}">
        <div class="label">${emoji||''} ${label||''}</div>
        <div class="pips" id="pips-${tid}">${pips}</div>
        <div class="btn-row"><button class="btn danger" onclick="useTracker('${tid}')">${T('spend')}</button><button class="btn" onclick="resetTracker('${tid}')">${T('reset')} (${total})</button></div>
      </div>`;
    });
  });
  // Spell slots
  (CHAR.spellSlots||[]).forEach(sl=>{
    const lv=sl.level; const tot=sl.total||0;
    const used=SESSION.spellSlots?.[lv]?.used||0;
    const color=DND.slotColors[lv]||'var(--accent)';
    let pips=''; for(let j=0;j<tot;j++) pips+=`<div class="pip${j<used?' used':''}" style="${j<used?'':'border-color:'+color+';background:'+color+';'}" onclick="clickSlotPip(${lv},${j})">${lv}</div>`;
    cards+=`<div class="pn-card">
      <div class="label" style="color:${color};">✨ Slot Lv${lv}</div>
      <div class="pips" id="slot${lv}-pips">${pips}</div>
      <div class="btn-row">
        <button class="btn danger" onclick="useSlot(${lv})">${T('spend')}</button>
        <button class="btn" onclick="resetSlot(${lv})">${T('reset')} (${tot})</button>
      </div>
    </div>`;
  });
  return `<div class="pn-grid">${cards}</div>`;
}

    <div class="inline-field" style="margin-top:8px;">
      <input type="text" id="conc-spell-input" placeholder="${T('none')}…" value="${S.concentration||''}">

    <div class="label">${T('round')}</div>

    </div>
    ${(()=>{const dex=abilityMod(C.abilityScores?.DEX||10);const bonus=(C.initiativeBonus??0);const total=dex+bonus;const parts=[modStr(dex)+' DEX'];if(bonus!==0)parts.push(modStr(bonus)+' '+T('lbl_initiativeBonus'));return '<div style="font-size:.8em;color:var(--text-muted);margin-top:2px;">'+parts.join(' + ')+' = <strong>'+modStr(total)+'</strong></div>';})()}

  const cur=S.currency||{pp:0,gp:0,ep:0,sp:0,cp:0};

      </div>`).join('')}
    </div>
    <div class="cur-controls">
      <button class="cur-btn" onclick="adjustCur(-1)">−</button>
      <input id="cur-step" class="cur-step" type="number" min="1" value="1">
      <button class="cur-btn" onclick="adjustCur(1)">+</button>

  </div>`;
  return `<div class="pn-grid">${concCard}${roundCard}${goldCard}</div>`;

// ─── Pannello Bottom: conditions, rests, log, actions, session, notes ───
function buildPanelBottom(){
  const S=SESSION, C=CHAR;
  // Conditions: standard D&D conditions + custom
  const stdConds=DND.conditions||[];
  const customConds=C.customConditions||[];
  const condGrid=stdConds.map(c=>`<div class="cond-btn${(S.conditions||[]).includes(c)?' active':''}" onclick="toggleCond(this,'${c.replace(/'/g,"\\'")}')">
    ${dndTr('conditions',c)||c}
  </div>`).join('') + customConds.map((c,i)=>`<div class="cond-btn${(S.conditions||[]).includes(c)?' active':''}" onclick="toggleCond(this,'${c.replace(/'/g,"\\'")}')">
    ${c}${EDIT_MODE?`<button class="btn-del-sm" onclick="event.stopPropagation();deleteCondition(${i})" style="margin-left:4px;">×</button>`:''}
  </div>`).join('');
  const condSection=`<div class="pn-card" style="margin-bottom:14px;">
    <div class="label">${T('conditions')}</div>
    <div class="cond-grid" id="cond-grid">${condGrid}</div>
    ${EDIT_MODE?`<button class="add-btn edit-only" onclick="addCondition()" style="margin-top:8px;">${T('addCondition')}</button>`:''}
    <div class="exhaustion-row" style="margin-top:10px;border-top:1px solid var(--border-light);padding-top:8px;">
      <span style="font-size:.8em;color:var(--text-muted);">${T('exhaustion')}:</span>
      <button class="btn" onclick="changeExhaustion(-1)" style="padding:1px 8px;font-size:.9em;">−</button>
      <span class="exhaustion-val${(S.exhaustion||0)>=3?' danger':''}">${S.exhaustion||0}</span>
      <button class="btn" onclick="changeExhaustion(1)" style="padding:1px 8px;font-size:.9em;">+</button>
      ${(S.exhaustion||0)>0?`<span class="exhaustion-penalty">${T('exhaustionPenalty').replace('{N}',S.exhaustion||0)}</span>`:''}
    </div>
  </div>`;
  // Rests + Log
  const available=(C.level||1)-(S.hitDice?.used||0);
  const hdType='d'+(C.hitDieType||8);
  const conMod=abilityMod(C.abilityScores?.CON||10);
  const hdModStr=conMod>=0?`+${conMod}`:String(conMod);
  const restsCardContent=S.hdDialog
    ?(available>0
      ?`<div class="label">${T('hdDialogTitle').replace('{A}',available).replace('{D}',hdType)}</div>
        <div class="hd-qty-row"><button class="btn-qty" onclick="adjustHDQty(-1)">−</button>
          <span class="hd-qty-val" id="hd-qty">1</span>
          <button class="btn-qty" onclick="adjustHDQty(1)">＋</button>
          <span id="hd-formula" style="font-size:.8em;color:var(--text-muted);margin-left:4px;">1${hdType}${hdModStr}</span></div>
        <input type="number" id="hd-result" min="0" placeholder="${T('hdEnterResult')}" style="width:72px;margin:6px 0;padding:4px 6px;border:1px solid var(--border);border-radius:5px;background:var(--bg-card);color:var(--text);">
        <div class="btn-row"><button class="btn heal" onclick="applyHDResult()">${T('hdApply')}</button>
          <button class="btn" onclick="closeHDDialog(true)">${T('hdSkip')}</button></div>`
      :`<div class="label">${T('hdNoHD')}</div>
        <div class="btn-row"><button class="btn" onclick="closeHDDialog(true)">${T('hdSkip')}</button></div>`)
    :`<div class="label">${T('rests')}</div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn long-rest" onclick="longRest()">${T('longRest')}</button>
        <button class="btn short-rest" onclick="shortRest()">${T('shortRest')}</button>
      </div>
      <div style="font-size:.75em;color:var(--text-muted);margin-top:6px;">${T('longRestNote')}<br>${T('shortRestNote')}</div>`;
  const restsLog=`<div class="pn-grid">
    <div class="pn-card">${restsCardContent}</div>
    <div class="pn-card" style="grid-column:span 2;">
      <div class="label">${T('log')}</div>
      <div id="log-wrap">${(SESSION.logEntries||[]).length>0?(SESSION.logEntries).map(e=>`<p class="${e.type||''}">${e.msg}</p>`).join(''):`<p style="color:var(--text-faint);font-style:italic;">${T('logEmpty')}</p>`}</div>
    </div>
  </div>`;
  // Quick Actions — auto-generated from spells + weapons + manual actions
  const actTypes=['action','bonus','reaction'];
  const actFilter=`<div class="action-filter-row">
    <button class="filter-btn active" onclick="filterActions(this,'all')">${T('allActions')}</button>
    ${actTypes.map(t=>`<button class="filter-btn" onclick="filterActions(this,'${t}')">${dndTr('actionLabels',t)||DND.actionLabels[t]}</button>`).join('')}
  </div>`;
  function actionBadge(type){
    const cls=type==='action'?'badge-azione':type==='bonus'?'badge-bonus':type==='reaction'?'badge-reazione':'badge-azione';
    return `<span class="action-badge ${cls}">${dndTr('actionLabels',type)||DND.actionLabels[type]}</span>`;
  }
  function spellQuickNote(sp){
    const parts=[];
    const firstLine=(sp.description||'').split('\n')[0].replace(/\*\*/g,'').trim().slice(0,55);
    if(firstLine) parts.push(firstLine);
    if(sp.saveAbility) parts.push(T('ts')+' '+sp.saveAbility);
    if(sp.concentration) parts.push(T('concentration'));
    if(sp.ritual) parts.push(T('ritual'));
    if(sp.range) parts.push(sp.range);
    if((sp.level||0)>0) parts.push(T('slotLvLabel')+' '+sp.level+'+');
    return parts.join(' | ');
  }
  const spellEntries=(C.spells||[]).map(sp=>{const t=normalizeActionType(sp.actionType||'action');return `<div class="action-entry" data-type="${t}">
    ${actionBadge(t)}
    <div class="action-entry-body">
      <div class="action-entry-name">${sp.emoji||''} ${sp.name||''}</div>
      <div class="action-entry-note">${spellQuickNote(sp)}</div>
    </div></div>`;}).join('');
  const pb=C.proficiencyBonusOverride??(C.proficiencyBonus||computedPB(C.level||1));
  const scores=C.abilityScores||{};
  const weaponEntries=(C.weapons||[]).map(w=>{
    const atkMod=abilityMod(scores[w.attackStat]||10);
    const magic=w.magicBonus||0;
    const atk=w.attackBonusOverride!=null?modStr(w.attackBonusOverride):modStr(pb+atkMod+magic);
    const dmgMod=atkMod+magic;
    const dmg=w.damageOverride||(w.damageDie||'?')+(dmgMod>=0?'+'+dmgMod:dmgMod);
    return `<div class="action-entry" data-type="action">
    ${actionBadge('action')}
    <div class="action-entry-body">
      <div class="action-entry-name">${w.emoji||''} ${w.name||''}</div>
      <div class="action-entry-note">${atk} | ${dmg} ${dndTr('damageTypes',w.damageType)||w.damageType||''}${w.properties?' | '+w.properties:''}</div>
    </div></div>`;}).join('');
  // Feature-embedded actions (v3: plural actions[] array)
  const featureActionEntries=(C.features||[]).flatMap(f=>
    (f.actions||[]).map(a=>{
      const t=normalizeActionType(a.type||'action');
      const label=a.label||f.title;
      const emoji=a.emoji||f.emoji;
      return `<div class="action-entry" data-type="${t}">
      ${actionBadge(t)}
      <div class="action-entry-body">
        <div class="action-entry-name">${emoji||''} ${label||''}</div>
        <div class="action-entry-note">${a.description||''}</div>
      </div></div>`;
    })
  ).join('');
  const allEntries=spellEntries+weaponEntries+featureActionEntries;
  const actionsCard=`<div class="pn-card" style="margin-top:14px;">
    <div class="label">${T('quickActions')}</div>
    ${actFilter}
    <div id="action-list">${allEntries||`<p class="empty-state">${T('noActions')}</p>`}</div>
  </div>`;
  // Session save/load
  const sessionCard=`<div class="pn-card" style="margin-top:14px;">
    <div class="label">${T('session')}</div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn long-rest" onclick="exportCharacter()">${T('saveSession')}</button>
      <label class="btn short-rest" style="cursor:pointer;">${T('loadSession')}<input type="file" id="import-session-click" accept=".json" onchange="importSession(event)" style="display:none;"></label>

  // Notes

function renderGettingStarted(){

function gsAction(key){
  if(!EDIT_MODE){EDIT_MODE=true;document.body.classList.add('edit-mode');renderAll();}
  if(key==='addWeapon') addWeapon();
  else if(key==='addEquip') addEquip();

function dismissGettingStarted(){

function renderSections(){
  const el=document.getElementById('sections-area');
  if(!CHAR){el.innerHTML='';return;}
  ensureSidebar();
  let html=renderGettingStarted()+renderLevelUpChecklist();
  for(const item of CHAR.sidebar||[]){
    if(typeof item==='object' && item.type==='sep'){
      html+='<hr class="section-sep">';
      continue;
    }
    const id=typeof item==='string'?item:item?.id;
    if(!id) continue;
    const reg=SECTION_REGISTRY[id];
    if(reg){
      if(reg.hiddenWhen && reg.hiddenWhen()) continue;
      html+=reg.render();
    } else {
      // Custom feature
      const fIdx=(CHAR.features||[]).findIndex(f=>slugify(f.title)===id||f.sectionId===id);
      if(fIdx>=0) html+=renderFeature(CHAR.features[fIdx],fIdx);

  }
