<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronache di Phandalin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #d8d8e8;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 17px;
      line-height: 1.8;
      padding: 2rem 1rem;
    }

    #content {
      max-width: 780px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      color: #c8c8f8;
      border-bottom: 2px solid #444466;
      padding-bottom: 0.5rem;
      margin: 2rem 0 1rem;
      letter-spacing: 0.05em;
    }

    h2 {
      font-size: 1.4rem;
      color: #9090e0;
      margin: 2.5rem 0 0.3rem;
      letter-spacing: 0.03em;
    }

    h3 {
      font-size: 1rem;
      color: #8888aa;
      font-weight: normal;
      font-style: italic;
      margin-bottom: 1.5rem;
    }

    p {
      margin: 0.9rem 0;
    }

    strong {
      color: #e8e8ff;
      font-weight: bold;
    }

    em {
      color: #b0b0d8;
      font-style: italic;
    }

    hr {
      border: none;
      border-top: 1px solid #2e2e4e;
      margin: 1.5rem 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }

    th, td {
      border: 1px solid #333355;
      padding: 0.5rem 0.8rem;
      text-align: left;
    }

    th {
      background: #22223a;
      color: #9090e0;
    }

    #loading {
      text-align: center;
      color: #666688;
      padding: 4rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="content"><p id="loading">Caricamento cronache...</p></div>
  <script>
    fetch('campaign.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = renderMd(md);
      })
      .catch(() => {
        document.getElementById('loading').textContent = 'Errore nel caricamento del file.';
      });

    function renderMd(text) {
      const lines = text.split('\n');
      let html = '';
      let inTable = false;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Tables
        if (line.startsWith('|')) {
          if (!inTable) { html += '<table>'; inTable = true; }
          const cells = line.split('|').filter((_, idx, arr) => idx > 0 && idx < arr.length - 1);
          const isHeader = i + 1 < lines.length && lines[i + 1].match(/^\|[-| :]+\|$/);
          const isSep = line.match(/^\|[-| :]+\|$/);
          if (isSep) continue;
          const tag = isHeader ? 'th' : 'td';
          html += '<tr>' + cells.map(c => `<${tag}>${inline(c.trim())}</${tag}>`).join('') + '</tr>';
          continue;
        } else if (inTable) {
          html += '</table>';
          inTable = false;
        }

        if (line.startsWith('### ')) {
          html += `<h3>${inline(line.slice(4))}</h3>`;
        } else if (line.startsWith('## ')) {
          html += `<h2>${inline(line.slice(3))}</h2>`;
        } else if (line.startsWith('# ')) {
          html += `<h1>${inline(line.slice(2))}</h1>`;
        } else if (line.startsWith('---')) {
          html += '<hr>';
        } else if (line.trim() === '') {
          // skip blank lines (handled via margins)
        } else {
          html += `<p>${inline(line)}</p>`;
        }
      }

      if (inTable) html += '</table>';
      return html;
    }

    function inline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }
  </script>
</body>
</html>
