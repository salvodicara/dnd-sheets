<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>D&D Sheets — AI Assistant</title>
  <style>
:root{--bg:#0f0f1a;--bg-card:#1a1a28;--bg2:#1a1a28;--bg3:#22223a;--bg-input:#14141f;
  --text:#e4dfc8;--text-muted:#8a8870;--text-faint:#504e60;--muted:#8a8870;
  --accent:#c9a227;--accent-dim:#1e1800;--accent-glow:rgba(201,162,39,.22);
  --border:#3a3620;--border-light:#28263a;--bl:#28263a;
  --shadow:0 4px 24px rgba(0,0,0,.55);--shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --sidebar-bg:#0a0a14;--sidebar-text:#9a9878;--sidebar-hover:#161620;
  --green:#2d7a2d;--on-accent:#1a0e00;--overlay:rgba(0,0,0,.55);}
[data-theme="light"]{--bg:#f5f0e8;--bg-card:#faf6ec;--bg2:#faf6ec;--bg3:#ede8dc;--bg-input:#e4ddd0;
  --text:#1e1508;--text-muted:#5c4e34;--text-faint:#8a7c64;--muted:#5c4e34;
  --accent:#8a6800;--accent-dim:#f0e4b8;--accent-glow:rgba(138,104,0,.15);
  --border:#b8a888;--border-light:#cdc3ac;--bl:#cdc3ac;
  --shadow:0 2px 16px rgba(40,30,10,.12);--shadow-sm:0 1px 6px rgba(40,30,10,.08);
  --sidebar-bg:#ede4d4;--sidebar-text:#3a3020;--sidebar-hover:#e0d4b8;
  --green:#226622;--on-accent:#faf6ec;--overlay:rgba(0,0,0,.3);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100dvh;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
#app-header{position:fixed;top:0;left:0;right:0;height:50px;z-index:1010;
  background:var(--bg-card);border-bottom:2px solid var(--accent);
  display:flex;align-items:center;padding:0 10px;gap:8px;box-shadow:var(--shadow-sm);}
.hdr-tabs{display:flex;gap:2px;margin:0 6px;}
.hdr-tab{color:var(--sidebar-text);font-size:.84em;padding:5px 11px;border-radius:6px;
  text-decoration:none;font-weight:500;transition:color .15s,background .15s;white-space:nowrap;
  border-bottom:2px solid transparent;}
.hdr-tab:hover{color:var(--accent);background:var(--sidebar-hover);}
.hdr-tab.active{color:var(--accent);font-weight:700;border-bottom-color:var(--accent);border-radius:0;}
.hdr-right{display:flex;gap:5px;margin-left:auto;}
.ctrl-btn{background:var(--sidebar-hover);border:1px solid rgba(201,162,39,.3);color:var(--sidebar-text);
  border-radius:8px;padding:7px 11px;font-size:.9em;cursor:pointer;transition:all .15s;
  box-shadow:var(--shadow-sm);text-decoration:none;display:inline-flex;align-items:center;
  font-family:inherit;white-space:nowrap;}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent);}
.ctrl-btn.active{background:rgba(201,162,39,.15);border-color:var(--accent);color:var(--accent);}
.hdr-logo{color:var(--accent);font-weight:800;font-size:.95em;text-decoration:none;
  white-space:nowrap;padding:2px 4px;flex-shrink:0;letter-spacing:.04em;
  text-shadow:0 0 12px rgba(201,162,39,.35);}
.hdr-logo:hover{opacity:.85;}
#ai-sidebar{position:fixed;left:0;top:50px;width:var(--ai-sb-w,240px);height:calc(100vh - 50px);
  background:var(--sidebar-bg);border-right:1px solid rgba(201,162,39,.2);
  display:flex;flex-direction:column;overflow-y:auto;z-index:200;transition:width .2s ease;}
#ai-sidebar.collapsed{overflow:hidden;}
#ai-overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:150;}
#ai-overlay.visible{display:block;}
#hamburger-ai{display:none;background:none;border:none;color:var(--sidebar-text);
  font-size:1.2em;cursor:pointer;padding:5px 7px;border-radius:6px;flex-shrink:0;line-height:1;}
#hamburger-ai:hover{background:var(--sidebar-hover);color:var(--accent);}
/* Sidebar top row: collapse toggle */
.ai-sb-top{display:flex;align-items:center;justify-content:flex-end;padding:6px 8px;
  flex-shrink:0;border-bottom:1px solid rgba(201,162,39,.2);}
#ai-sidebar.collapsed .ai-sb-top{justify-content:center;}
.ai-sb-toggle{background:none;border:none;color:var(--sidebar-text);cursor:pointer;
  font-size:1rem;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;transition:color .15s,background .15s;line-height:1;}
.ai-sb-toggle:hover{background:var(--sidebar-hover);color:var(--accent);}
/* Sidebar panels */
.ai-panel{flex-shrink:0;border-bottom:1px solid rgba(201,162,39,.12);}
.ai-panel-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  color:var(--sidebar-text);font-size:.8rem;font-weight:600;transition:background .15s;
  user-select:none;min-height:38px;}
.ai-panel-hdr:hover{background:var(--sidebar-hover);color:var(--accent);}
.ai-panel-icon{font-size:.9rem;flex-shrink:0;width:18px;text-align:center;}
.ai-panel-label{flex:1;white-space:nowrap;overflow:hidden;color:var(--sidebar-text);}
.ai-panel-badge{color:var(--accent);font-size:.72rem;font-weight:400;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:90px;flex-shrink:0;}
.ai-panel-arrow{font-size:.7rem;color:var(--text-faint);transition:transform .2s;flex-shrink:0;}
.ai-panel.open .ai-panel-arrow{transform:rotate(180deg);}
.ai-panel-content{overflow:hidden;display:none;}
.ai-panel.open .ai-panel-content{display:block;}
#ai-sidebar.collapsed .ai-panel-label,
#ai-sidebar.collapsed .ai-panel-badge,
#ai-sidebar.collapsed .ai-panel-arrow,
#ai-sidebar.collapsed .ai-panel-content{display:none;}
#ai-sidebar.collapsed .ai-panel-hdr{justify-content:center;padding:9px 0;}
#ai-sb-resize{position:absolute;right:0;top:0;width:5px;height:100%;cursor:col-resize;z-index:10;
  background:transparent;transition:background .15s;}
#ai-sb-resize:hover,#ai-sb-resize.dragging{background:var(--accent-glow);}
#ai-sidebar.collapsed #ai-sb-resize{display:none;}
/* Main chat area */
#ai-main{margin-left:var(--ai-sb-w,240px);margin-top:50px;display:flex;flex-direction:column;
  height:calc(100vh - 50px);overflow:hidden;transition:margin-left .2s ease;}
/* Dismissable disclaimer */
.ai-disclaimer{color:var(--text-muted);font-size:.72rem;padding:.3rem .9rem;flex-shrink:0;
  border-top:1px solid var(--border-light);background:var(--bg-card);
  display:flex;align-items:center;gap:.5rem;}
.ai-disclaimer-text{flex:1;text-align:center;}
.ai-disclaimer-close{background:none;border:none;color:var(--text-faint);cursor:pointer;
  font-size:1rem;line-height:1;padding:0 2px;transition:color .15s;flex-shrink:0;}
.ai-disclaimer-close:hover{color:var(--text-muted);}
html.disclaimer-dismissed #ai-disclaimer{display:none;}
[data-theme="light"] .ctrl-btn{background:var(--sidebar-hover);border-color:rgba(138,104,0,.3);color:var(--sidebar-text);}
/* Mobile */
@media(max-width:768px){
  #ai-sidebar{transform:translateX(-100%);transition:transform .25s ease,width .2s ease;}
  #ai-sidebar.mobile-open{transform:translateX(0);width:260px!important;}
  #ai-main{margin-left:0;height:calc(100dvh - 50px);}
  #hamburger-ai{display:flex!important;align-items:center;}
  .hdr-right{display:none!important;}
  .hdr-tabs{display:none!important;}
  #hdr-overflow-btn{display:flex!important;}
  #ui{max-height:80px;}
  .ibar{padding:.4rem .7rem .5rem;}
}
/* ── Overflow menu (mobile theme/lang) ── */
#hdr-overflow-btn{display:none;background:none;border:none;color:var(--sidebar-text);
  font-size:1.3em;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;margin-left:auto;}
#hdr-overflow-btn:hover{background:var(--sidebar-hover);color:var(--accent);}
#hdr-overflow-menu{display:none;position:fixed;top:53px;right:10px;
  background:var(--sidebar-bg);border:1px solid var(--accent);border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:2000;min-width:140px;padding:6px 0;}
#hdr-overflow-menu.open{display:block;}
.overflow-item{display:flex;align-items:center;gap:10px;width:100%;background:none;
  border:none;color:var(--sidebar-text);font-size:.9em;padding:9px 16px;cursor:pointer;
  text-align:left;transition:background .12s,color .12s;text-decoration:none;}
.overflow-item:hover{background:var(--sidebar-hover);color:var(--accent);}
.pb{padding:.55rem .9rem .8rem;background:var(--bg3);}
.row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.38rem;}
label{font-size:.78rem;color:var(--muted);white-space:nowrap;}
select,input[type=password]{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:.26rem .52rem;font-size:.82rem;flex:1;min-width:0;outline:none;}
select:focus,input:focus{border-color:var(--accent);}
textarea.jta{width:100%;height:65px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:.4rem .52rem;font-family:monospace;font-size:.71rem;resize:vertical;display:block;outline:none;}
textarea.jta:focus{border-color:var(--accent);}
.btn{border:none;border-radius:5px;padding:.28rem .8rem;font-size:.79rem;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.82;}.btn:disabled{opacity:.4;cursor:default;}
.ba{background:linear-gradient(135deg,#c9a227,#a07e18);color:#1a0e00;}.bg{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.bdl{background:var(--green);color:#fff;width:100%;margin-top:.4rem;padding:.38rem;font-size:.82rem;}
.bload{background:var(--accent);color:var(--on-accent);width:100%;margin-top:.3rem;padding:.38rem;font-size:.82rem;}
.bsm{padding:.18rem .58rem;font-size:.74rem;}
.chat{flex:1;overflow-y:auto;padding:.65rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;min-height:0;}
.msg{display:flex;flex-direction:column;max-width:92%;}
.msg.u{align-self:flex-end;align-items:flex-end;}.msg.a{align-self:flex-start;align-items:flex-start;}
.bbl{padding:.5rem .8rem;border-radius:11px;font-size:.85rem;line-height:1.55;word-break:break-word;}
.msg.u .bbl{background:linear-gradient(135deg,#c9a227,#a07e18);color:#1a0e00;font-weight:500;}.msg.a .bbl{background:var(--bg2);border:1px solid var(--bl);}
.bbl pre{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:.45rem;font-size:.71rem;overflow-x:auto;white-space:pre-wrap;margin:.3rem 0;max-height:180px;}
.ibar{padding:.6rem .9rem .7rem;flex-shrink:0;background:var(--bg);}
.ibar-box{background:var(--bg-card);border:1.5px solid var(--border-light);border-radius:12px;
  overflow:hidden;transition:border-color .2s;}
.ibar-box:focus-within{border-color:var(--accent);}
#ui{width:100%;background:transparent;color:var(--text);border:none;
  padding:.65rem .9rem .3rem;font-size:.88rem;font-family:inherit;resize:none;
  height:42px;max-height:130px;outline:none;line-height:1.5;display:block;}
.ibar-row{display:flex;align-items:center;padding:.3rem .45rem;gap:.3rem;
  border-top:1px solid var(--border-light);}
.ibar-icon-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;
  font-size:.95rem;width:30px;height:30px;border-radius:6px;transition:color .15s,background .15s;
  display:inline-flex;align-items:center;justify-content:center;font-family:inherit;}
.ibar-icon-btn:hover{color:var(--text);background:var(--bg3);}
.ibar-send{margin-left:auto;background:linear-gradient(135deg,#c9a227,#a07e18);color:#1a0e00;border:none;
  border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:1rem;font-weight:700;
  transition:opacity .15s,transform .1s,box-shadow .15s;display:flex;align-items:center;justify-content:center;}
.ibar-send:hover{opacity:.9;box-shadow:0 0 10px rgba(201,162,39,.4);}
.ibar-send:active{transform:scale(.95);}
.hint{color:var(--muted);font-size:.75rem;margin-top:.26rem;}
.cbdg{color:var(--accent);font-size:.73rem;font-weight:400;}
a{color:var(--accent);}
@keyframes blink{0%,100%{opacity:.15;}50%{opacity:.85;}}
.thinking .bbl::after{content:' ● ● ●';animation:blink 1.4s infinite;color:var(--muted);font-size:.68rem;}
.chips{padding:.35rem 1.1rem .2rem;display:flex;flex-wrap:wrap;gap:.35rem;flex-shrink:0;}
.chip{background:var(--bg3);color:var(--accent);border:1px solid rgba(201,162,39,.3);border-radius:12px;padding:.22rem .7rem;font-size:.76rem;cursor:pointer;transition:border-color .15s,background .15s;}
.chip:hover{border-color:var(--accent);background:rgba(201,162,39,.1);}
.toast-notif{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%) translateY(8px);background:var(--bg-card);color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast-notif.show{opacity:1;transform:translateX(-50%) translateY(0);}
.ibar-icon-btn:focus{outline:none;box-shadow:0 0 0 2px var(--accent-glow);}
.att-chip{display:flex;align-items:center;gap:.4rem;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:.18rem .55rem;font-size:.76rem;color:var(--text);margin:.3rem 1.1rem 0;align-self:flex-start;}
.att-chip-icon{font-size:.85rem;}
.att-chip-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.att-chip-rm{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 0 0 .2rem;font-size:1rem;line-height:1;transition:color .12s;}
.att-chip-rm:hover{color:var(--accent);}
  </style>
  <script>
    // Apply persisted states before first paint to avoid flash
    (function(){
      var t=localStorage.getItem('dnd-theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      if(localStorage.getItem('aiSidebarCollapsed')==='1'){
        document.documentElement.style.setProperty('--ai-sb-w','48px');
      } else {
        var w=localStorage.getItem('aiSidebarWidth');
        if(w) document.documentElement.style.setProperty('--ai-sb-w',w);
      }
      if(localStorage.getItem('aiDisclaimerDismissed')==='1')
        document.documentElement.classList.add('disclaimer-dismissed');
    })();
  </script>

  <script type="text/x-prompt" id="sys">You are an expert D&D 2024 assistant. You help with two things equally well:

1. General D&D 2024 questions — rules, spells, classes, subclasses, feats, monsters, conditions, action economy, combat, exploration, social pillars, magic items, multiclassing, and anything else from the 2024 core rules.
2. Character sheet updates — adding spells, features, equipment, weapons, levelling up, updating stats, etc. for the D&D Sheets app (https://salvodicara.github.io/dnd-sheets/).

For general questions, just answer clearly and accurately.
For character updates, always respond in this exact order:
1. **Explanation** — what you are changing and why (1–3 sentences).
2. **Wizard steps** — numbered instructions for doing this manually via the app's UI wizards.
3. **JSON Patch** — a ```json-patch``` block at the very end. See output format section below.
If no character has been shared yet, still give explanation + wizard steps + a full creation patch: an ops array with one op — [{"op":"add","path":"/character","value":{...}}] — containing a complete, schema-valid character object (all fields from the schema below).

## Style rules (for character content)
1. Match the language of existing JSON content (Italian descriptions → write in Italian).
2. Use **bold** for key D&D terms: damage types, conditions, action types, spell names.
3. Use 📌 prefix for tactical tips — short and play-relevant, not rulebook text.
4. Descriptions are concise reference text — read mid-session, not for learning.
5. Spells: always put the English D&D 2024 name in originalName, even if name is localized.
6. Meaningful emojis: 🔥 fire · ❤️ healing · ⚔️ melee · 🔒 control · 💥 AoE · 🛡️ defense · 🎵 bardic · 👁️ illusion · ⚡ lightning · ❄️ cold · ☠️ necrotic · ✨ radiant · 🌿 nature
7. Verify mechanics at: http://dnd2024.wikidot.com/
8. Never expose technical details in prose or wizard steps: no array indices, no JSON paths, no field names, no "position N", no "op: remove". Speak only in plain D&D terms (e.g. "I'll remove the Invisibility Potion from your equipment", not "I'll remove item at index 9").

## Complete JSON schema

Exported file shape: { version:"3.0", savedAt, character:{...}, session:{...} }

### character — top-level fields
name, quote, race, class, subclass, level (1–20), background, alignment, playerName
speed (e.g. "9 m"), ac (number), armorNote (e.g. "Leather +DEX")
hp: { max: number }
hitDieType: 4|6|8|10|12
initiativeBonus: number (optional flat bonus on top of DEX)
languages (comma-separated string), toolProficiencies (string)
abilityBudget: number (default 27)
proficiencyBonusOverride: number|null (null = auto from level)
levelUpChecklist: [{text:string, done:boolean}] | null

### character.abilityScores
{ STR, DEX, CON, INT, WIS, CHA }  — all integers

### character.savingThrows
string[] — ability codes with save proficiency, e.g. ["DEX","CHA"]

### character.skills
Map of skill → proficiency. Omit skills with no proficiency.
Keys: acrobatics · animalHandling · arcana · athletics · deception · history · insight · intimidation · investigation · medicine · nature · perception · performance · persuasion · religion · sleightOfHand · stealth · survival
Values: "proficient" | "expertise" | "halfProficiency"

### character.spellcasting
ability: "CHA"|"INT"|"WIS"
preparedCaster: boolean (Cleric/Druid/Paladin/Wizard = true; Bard/Warlock/Sorcerer = false)
focus: string (e.g. "Arcane focus", "Musical instrument")
spellDCOverride: number|null
spellAttackOverride: number|null

### character.spellSlots[] — each slot tier
level: integer 1–9
total: integer
pactMagic: boolean (omit if false) — recovers on short rest

### character.spells[] — each spell
level: 0=cantrip, 1–9
name: localized display name
originalName: English D&D 2024 name (ALWAYS present, ALWAYS English)
emoji: string
actionType: "action"|"bonus"|"reaction"|"free"
school: Evocation|Enchantment|Illusion|Abjuration|Conjuration|Divination|Necromancy|Transmutation
range: string (e.g. "18 m", "Touch", "Self")
concentration: boolean (omit entirely if false)
duration: string (e.g. "Instantaneous", "1 minute", "Concentration, up to 1 hour")
saveAbility: "STR"|"DEX"|"CON"|"INT"|"WIS"|"CHA" (omit if no saving throw)
description: string — **bold** key terms, \n for line breaks
scaling: string (omit if no upcast) — e.g. "+1d6 per slot above 1st"
notes: string (omit if none) — "📌 tactical tip"

## JSON Patch output format (RFC 6902)
End EVERY character update response with a ```json-patch``` block — a JSON array of patch operations.
Always try to produce a complete patch; the app handles malformed patches gracefully.
Output the block directly after the wizard steps, with NO heading or label before it.
- Append to array: {"op":"add","path":"/character/spells/-","value":{...}}
- Update a field:  {"op":"replace","path":"/character/abilityScores/STR","value":18}
- Remove an item:  {"op":"remove","path":"/character/spells/2"}

- Use /character/... or /session/... as the path prefix

- For complex changes, use targeted ops — do NOT output the full JSON
- For pure rules questions (no sheet change), omit the json-patch block entirely

function render(text){
  const parts=[]; let last=0;
  const re=/```(json(?:-patch|-char)?)\s*([\s\S]*?)```/g; let m;
  while((m=re.exec(text))!==null){
    if(m.index>last)parts.push({t:'md',v:text.slice(last,m.index)});
    parts.push({t:m[1],v:m[2].trim()}); last=m.index+m[0].length;
  }
  if(last<text.length){
    const tail=text.slice(last);
    const unc=/```(json(?:-patch|-char)?)\s*([\s\S]*)/.exec(tail);
    if(unc){
      if(unc.index>0)parts.push({t:'md',v:tail.slice(0,unc.index)});
      parts.push({t:unc[1],v:unc[2].trim()});
    }else parts.push({t:'md',v:tail});
  }
  return(parts.length?parts:[{t:'md',v:text}]).map(p=>{
    if(p.t==='json-patch'){
      try{
        let parsed=JSON.parse(p.v);
        if(parsed&&!Array.isArray(parsed)&&parsed.op&&parsed.path) parsed=[parsed];
        if(Array.isArray(parsed)&&parsed.length>0&&parsed[0].op&&parsed[0].path){

          window[uid]=parsed;

        }
      }catch(e){}
      return '<p class="hint" style="margin-top:.3rem;">⚠ '+UI('patchFailed')+'</p>';
    }
    if(p.t==='json-char'){
      try{
        const parsed=JSON.parse(p.v);
        if(parsed&&(parsed.character||parsed.name)){
          const uid='c'+Date.now()+Math.random().toString(36).slice(2,7);
          window[uid]=parsed;
          return '<button class="btn bload" onclick="importChar(\''+uid+'\')">&#10011; '+UI('importBtn')+'</button>';
        }
      }catch(e){}
      return '<p class="hint" style="margin-top:.3rem;">⚠ '+UI('patchFailed')+'</p>';
    }
    if(p.t==='json'){
      try{
        let parsed=JSON.parse(p.v);
        if(parsed&&!Array.isArray(parsed)&&parsed.op&&parsed.path) parsed=[parsed];
        if(Array.isArray(parsed)&&parsed.length>0&&parsed[0].op&&parsed[0].path){
          const uid='p'+Date.now()+Math.random().toString(36).slice(2,7);
          window[uid]=parsed;
          return '<button class="btn bload" onclick="applyPatch(\''+uid+'\')">&#10003; '+UI('applyBtn')+'</button>';
        }
        // Detect full character object (model used ```json instead of ```json-char)

          const uid='c'+Date.now()+Math.random().toString(36).slice(2,7);
          window[uid]=parsed;
          return '<button class="btn bload" onclick="importChar(\''+uid+'\')">&#10011; '+UI('importBtn')+'</button>';
        }
      }catch(e){}
      return '';
    }
    return esc(p.v)
      .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
      .replace(/\*\*([^*\n]{1,80})\*\*/g,'<strong>$1</strong>')

// ── JSON Patch (RFC 6902) ─────────────────────────────────────────────────
function applyJsonPatch(obj,ops){
  // Navigate to parent. For 'add', auto-creates missing intermediate nodes.
  function nav(root,path,create){
    const segs=path.replace(/^\//,'').split('/').map(s=>s.replace(/~1/g,'/').replace(/~0/g,'~'));
    const last=segs.pop();
    let cur=root;
    for(let i=0;i<segs.length;i++){
      const s=segs[i];
      if(cur==null)throw new Error('Path not found: '+path);
      if(create&&cur[s]==null){
        const next=segs[i+1]||last;
        cur[s]=(next==='-'||/^\d+$/.test(next))?[]:{};
      }
      cur=Array.isArray(cur)?cur[parseInt(s,10)]:cur[s];
    }
    if(cur==null)throw new Error('Parent not found for path: '+path);
    return{parent:cur,key:last};
  }
  const result=JSON.parse(JSON.stringify(obj));
  for(const op of ops){
    const{parent,key}=nav(result,op.path,op.op==='add');
    if(op.op==='add'){
      if(Array.isArray(parent)&&key==='-')parent.push(op.value);
      else if(Array.isArray(parent))parent.splice(parseInt(key,10),0,op.value);
      else parent[key]=op.value;
    }else if(op.op==='replace'){
      if(Array.isArray(parent))parent[parseInt(key,10)]=op.value;
      else parent[key]=op.value;
    }else if(op.op==='remove'){
      if(Array.isArray(parent))parent.splice(parseInt(key,10),1);
      else delete parent[key];
    }
  }
  return result;
}

// ── Document parsing ──────────────────────────────────────────────────────
function decodePdfStr(s){
  // Detect UTF-16BE BOM (bytes 0xFE 0xFF stored as Latin-1 chars 254 255)
  if(s.charCodeAt(0)===0xFE&&s.charCodeAt(1)===0xFF){
    const bytes=[];
    for(let i=2;i<s.length;i++){
      if(s[i]==='\\'&&i+1<s.length){
        const n=s[i+1];
        if(n>='0'&&n<='7'){
          let oct='',j=i+1;
          while(j<i+4&&j<s.length&&s[j]>='0'&&s[j]<='7'){oct+=s[j++];}
          bytes.push(parseInt(oct,8));i=j-1;
        }else{const em={n:10,r:13,t:9,b:8,f:12};bytes.push(em[n]??s.charCodeAt(i+1));i++;}
      }else{bytes.push(s.charCodeAt(i));}
    }
    let out='';
    for(let j=0;j<bytes.length-1;j+=2){
      const cp=(bytes[j]<<8)|bytes[j+1];
      if(cp===0x0D||cp===0x0A){out+='\n';}else if(cp>0x001F){out+=String.fromCodePoint(cp);}
    }
    return out.replace(/\n{3,}/g,'\n\n').trim();
  }
  // Plain string: decode PDF escape sequences
  return s.replace(/\\([0-7]{1,3})/g,(_,o)=>String.fromCharCode(parseInt(o,8)))
    .replace(/\\n/g,'\n').replace(/\\r/g,'\n').replace(/\\t/g,'\t').replace(/\\(.)/g,'$1').trim();
}
function extractPdfText(buf){
  const latin1=new TextDecoder('latin1').decode(buf);
  // Method 1: AcroForm fields — works for all official D&D 5e fillable PDFs
  const fields=[];
  const objRe=/\d+ \d+ obj([\s\S]*?)endobj/g; let om;
  while((om=objRe.exec(latin1))!==null){
    const blk=om[1];
    if(!blk.includes('/T')||!blk.includes('/V'))continue;
    const tM=/\/T\s*\(([^)\\]*(?:\\.[^)\\]*)*)\)/.exec(blk);
    const vM=/\/V\s*\(([^)\\]*(?:\\.[^)\\]*)*)\)/.exec(blk);
    if(tM&&vM){const val=decodePdfStr(vM[1]);if(val)fields.push(tM[1].trim()+': '+val);}
  }
  if(fields.length>4)return fields.join('\n').slice(0,12000);
  // Method 2: BT/ET blocks (uncompressed simple PDFs)
  const parts=[];
  const btRe=/BT\s+([\s\S]*?)ET/g; let m;
  while((m=btRe.exec(latin1))!==null){
    const blk=m[1];
    const tjRe=/\(([^)\\]*(?:\\.[^)\\]*)*)\)\s*Tj/g; let t;
    while((t=tjRe.exec(blk))!==null){const v=decodePdfStr(t[1]);if(v)parts.push(v);}
    const tjARe=/\[([^\]]*)\]\s*TJ/g;
    while((t=tjARe.exec(blk))!==null){const sRe=/\(([^)\\]*(?:\\.[^)\\]*)*)\)/g;let q;while((q=sRe.exec(t[1]))!==null){const v=decodePdfStr(q[1]);if(v.trim())parts.push(v);}}
  }
  const r=parts.join(' ').replace(/\s+/g,' ').trim();
  return r.length>100?r.slice(0,12000):'';
}
async function extractDocxText(buf){
  try{
    const u8=new Uint8Array(buf),view=new DataView(buf);
    let off=0;
    while(off<u8.length-4){
      if(view.getUint32(off,true)!==0x04034b50){off++;continue;}
      const comp=view.getUint16(off+8,true);
      const csz=view.getUint32(off+18,true);
      const fnLen=view.getUint16(off+26,true);
      const exLen=view.getUint16(off+28,true);
      const fn=new TextDecoder().decode(u8.slice(off+30,off+30+fnLen));
      const dOff=off+30+fnLen+exLen;
      if(fn==='word/document.xml'){
        const raw=u8.slice(dOff,dOff+csz);
        let xml='';
        if(comp===0){xml=new TextDecoder().decode(raw);}
        else if(comp===8){
          const ds=new DecompressionStream('deflate-raw');
          const w=ds.writable.getWriter(); w.write(raw); w.close();
          const chunks=[]; const rd=ds.readable.getReader();
          while(true){const{done,value}=await rd.read();if(done)break;chunks.push(value);}
          const merged=new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));
          let p=0; for(const c of chunks){merged.set(c,p);p+=c.length;}
          xml=new TextDecoder().decode(merged);
        }
        return xml.replace(/<w:t[^>]*>/g,'').replace(/<\/w:t>/g,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
      }
      off=dOff+csz;
    }
  }catch(e){}
  return '';
}
async function parseDocumentFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='txt'){return await file.text();}
  if(ext==='pdf'){const buf=await file.arrayBuffer();return extractPdfText(buf);}
  if(ext==='docx'){const buf=await file.arrayBuffer();return await extractDocxText(buf);}
  return await file.text();
}

  const r=await fetch(info.ep,{method:'POST',headers:hdrs,body:JSON.stringify({model:info.model,messages})});
  if(!r.ok){
    if(r.status===429){const err=new Error(UI('rateLimited'));err.status=429;throw err;}
    const t=await r.text().catch(()=>'');
    let msg='HTTP '+r.status;
    try{const e=JSON.parse(t);msg=e.error?.message||msg;}catch(_){if(t)msg+=' — '+t.slice(0,200);}
    throw new Error(msg);
  }
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'';
}
async function streamOAI(p,key,messages,onChunk){
  const info=PROVS[p];
  const hdrs={'Content-Type':'application/json'};
  if(!info.noKey) hdrs['Authorization']='Bearer '+key;
  if(p==='openrouter'){hdrs['HTTP-Referer']='https://salvodicara.github.io/dnd-sheets/';hdrs['X-Title']='D&D Sheets';}
  const r=await fetch(info.ep,{method:'POST',headers:hdrs,body:JSON.stringify({model:info.model,messages,stream:true})});
  if(!r.ok){
    if(r.status===429){const err=new Error(UI('rateLimited'));err.status=429;throw err;}
    const t=await r.text().catch(()=>'');
    let msg='HTTP '+r.status;
    try{const e=JSON.parse(t);msg=e.error?.message||msg;}catch(_){if(t)msg+=' — '+t.slice(0,200);}
    throw new Error(msg);
  }
  const reader=r.body.getReader(),dec=new TextDecoder(); let buf='',full='';
  while(true){
    const{done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true}); let nl;
    while((nl=buf.indexOf('\n'))!==-1){
      const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
      if(line.startsWith('data: ')&&line!=='data: [DONE]'){
        try{const d=JSON.parse(line.slice(6));const c=d.choices?.[0]?.delta?.content||'';if(c){full+=c;onChunk(full);}}catch(e){}
      }
    }
  }
  return full;
}
// ── Send ──────────────────────────────────────────────────────────────────
async function send(){
  const ta=document.getElementById('ui'), text=ta.value.trim();
  // Build mode: document attached — require no text OR allow text as extra context
  if(!text&&!STAGED_FILE)return;
  document.getElementById('chips').style.display='none';
  ta.value=''; resize(ta); document.getElementById('sb').disabled=true;
  // ── Document attached ─────────────────────────────────────────────────
  if(STAGED_FILE){
    const sf=STAGED_FILE; clearStagedFile();
    const docContent='Document: '+sf.name+'\n\n---\n'+sf.text.slice(0,12000);
    const buildMode=!text; // no user text → treat as character sheet import
    const userMsg=buildMode?docContent:(text+'\n\n'+docContent);
    if(buildMode) HISTORY=[]; // fresh context for character import only
    HISTORY.push({role:'user',content:userMsg});
    addMsg('u','📎 '+sf.name+(text?' — '+text:''));
    const mid='m'+Date.now(); const el=addMsg('a','',mid); el.classList.add('thinking');
    try{
      const p=gProv(), key=gKey(p), info=PROVS[p];
      const lang=currentLang==='it'?'Italian':'English';
      const sys=buildMode?(sysBuild+'\n\nRespond in '+lang+'.'):((info.sysShort||getSys())+'\n\nRespond in '+lang+'.');
      if(!info.noKey&&!key)throw new Error(UI('sendError'));
      let resp='';
      if(p==='gemini'){resp=await callGemini(key,sys,[...HISTORY]);}
      else if(info.noStream){resp=await callOAI(p,key,[{role:'system',content:sys},...HISTORY]);}
      else{resp=await streamOAI(p,key,[{role:'system',content:sys},...HISTORY],t=>updMsg(mid,t||'…'));}
      if(!resp)resp=UI('emptyResp');
      updMsg(mid,resp); HISTORY.push({role:'assistant',content:resp});
      saveHistory();
    }catch(e){updMsg(mid,'**Error:** '+e.message);}
    document.getElementById('sb').disabled=false; return;
  }
  // ── Normal mode ───────────────────────────────────────────────────────
  if(CHAR&&!CHAR_DONE){
    const c4ai=JSON.parse(JSON.stringify(CHAR));
    if(c4ai.session){c4ai.session.portrait=null;c4ai.session.logEntries=[];}
    HISTORY.push({role:'user',content:'Here is my full character JSON:\n```json\n'+JSON.stringify(c4ai)+'\n```'});
    HISTORY.push({role:'assistant',content:'Got it — I have your full character. What would you like to change?'});
    CHAR_DONE=true;
  }
  HISTORY.push({role:'user',content:text}); addMsg('u',text);
  const mid='m'+Date.now(); const el=addMsg('a','',mid); el.classList.add('thinking');
  try{
    const p=gProv(), key=gKey(p), info=PROVS[p];
    const lang=currentLang==='it'?'Italian':'English';
    const sys=(info.sysShort||getSys())+'\n\nRespond in '+lang+'.';
    const hist=info.maxHistory?HISTORY.slice(-info.maxHistory):HISTORY;
    if(!info.noKey&&!key) throw new Error(UI('sendError'));
    let resp='';
    if(p==='gemini'){
      resp=await callGemini(key,sys,[...hist]);
      updMsg(mid,resp);
    }else if(info.noStream){
      const msgs=[{role:'system',content:sys},...hist];
      resp=await callOAI(p,key,msgs);
      updMsg(mid,resp);
    }else{
      const msgs=[{role:'system',content:sys},...hist];
      resp=await streamOAI(p,key,msgs,t=>updMsg(mid,t||'…'));
    }
    if(!resp) resp=UI('emptyResp');
    updMsg(mid,resp); HISTORY.push({role:'assistant',content:resp});
    saveHistory();
  }catch(e){updMsg(mid,'**Error:** '+e.message);}
  document.getElementById('sb').disabled=false;
}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function resize(el){el.style.height='42px';el.style.height=Math.min(el.scrollHeight,130)+'px';}
  </script>
